<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чистый Фронт — портал и диспетчерская</title>
<meta name="description" content="Демо: портал клиента и диспетчерская клининговой компании. Данные вымышлены.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E6EAE7;--bg2:#D9DFDB;--surf:#FFFFFF;--surf2:#F2F4F2;--line:#D0D8D3;--line2:#B9C3BD;
  --ink:#131A1B;--ink2:#566260;--ink3:#7C8886;
  --brand:#1B2527;--brandInk:#EEF2EF;--brand2:#2A3638;--sel:#1B2527;--selInk:#F4F6F4;
  --act:#FFC21A;--actH:#FFB000;--actInk:#16150D;
  --ok:#127A52;--okBg:#DDF1E7;--warn:#9A5B00;--warnBg:#FCEBCB;--bad:#BE3128;--badBg:#F9DFDC;--info:#2457C5;--infoBg:#DFE8FA;
  --land:#DCE2DE;--dist:#CFD8D2;--distLine:#BCC7C0;--water:#AFCAD3;--road:#F7F9F8;--pin:#1B2527;
  --sh:0 1px 0 rgba(19,26,27,.05),0 10px 30px -14px rgba(19,26,27,.32);
  --r:8px;--fd:'Jost','Trebuchet MS',system-ui,sans-serif;--fb:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1112;--bg2:#070A0B;--surf:#141B1D;--surf2:#1A2326;--line:#263235;--line2:#34434A;
  --ink:#E8EDEB;--ink2:#9BA8A6;--ink3:#73817F;--brand:#1E2A2D;--brandInk:#EEF2EF;--brand2:#2B393C;--sel:#E8EDEB;--selInk:#111718;
  --okBg:#123527;--ok:#4FCB95;--warnBg:#3A2A0E;--warn:#F2B24B;--badBg:#3D1714;--bad:#FF7A70;--infoBg:#14254A;--info:#82A6FF;
  --land:#141D1F;--dist:#18232A;--distLine:#26343B;--water:#1D3D49;--road:#23323A;--pin:#E8EDEB;
  --sh:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1112;--bg2:#070A0B;--surf:#141B1D;--surf2:#1A2326;--line:#263235;--line2:#34434A;
  --ink:#E8EDEB;--ink2:#9BA8A6;--ink3:#73817F;--brand:#1E2A2D;--brandInk:#EEF2EF;--brand2:#2B393C;--sel:#E8EDEB;--selInk:#111718;
  --okBg:#123527;--ok:#4FCB95;--warnBg:#3A2A0E;--warn:#F2B24B;--badBg:#3D1714;--bad:#FF7A70;--infoBg:#14254A;--info:#82A6FF;
  --land:#141D1F;--dist:#18232A;--distLine:#26343B;--water:#1D3D49;--road:#23323A;--pin:#E8EDEB;
  --sh:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg2);color:var(--ink);font:400 15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:15px;height:15px}.i.l{width:22px;height:22px}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* stage & frame */
.stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg2)}
@media (min-width:761px){.stage{padding-right:74px}}
.app{position:relative;container-type:inline-size;background:var(--bg);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;width:100%;height:100%}
.stage.phone .app{width:390px;height:min(800px,calc(100vh - 40px));border-radius:38px;border:10px solid #0A0E0F;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.phcap{position:absolute;left:max(24px,calc(50% - 470px));top:50%;transform:translateY(-50%);width:230px;color:var(--ink2);font-size:14px;display:none}
.stage.phone .phcap{display:block}
.phcap b{display:block;font:600 22px/1.15 var(--fd);color:var(--ink);margin-bottom:8px}
@media (max-width:1100px){.phcap{display:none!important}}
.scr{overflow:auto;min-height:0;overscroll-behavior:contain}
.view{animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* header */
.hd{display:flex;align-items:center;gap:20px;padding:12px 28px;background:var(--surf);border-bottom:1px solid var(--line);min-width:0}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mk{width:34px;height:34px;border-radius:6px;background:var(--brand);color:var(--act);display:grid;place-items:center;flex:none}
.logo b{font:600 18px/1 var(--fd);display:block;white-space:nowrap}
.logo span{font-size:12px;color:var(--ink2);white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:12px}
.nav button{padding:9px 14px;border-radius:6px;color:var(--ink2);font-weight:500;display:flex;gap:8px;align-items:center;transition:background .15s,color .15s}
.nav button:hover{background:var(--surf2);color:var(--ink)}
.nav button.on{color:var(--ink);background:var(--surf2);box-shadow:inset 0 -2px 0 var(--ink)}
.bdg{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);white-space:nowrap}
.ava{width:34px;height:34px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:600;transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--act);color:var(--actInk)}.btn.y:hover{background:var(--actH)}
.btn.d{background:var(--brand);color:var(--brandInk)}.btn.d:hover{background:var(--brand2)}
.btn.g{background:var(--surf2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.btn.g:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px 3px 7px;border-radius:4px;white-space:nowrap}
.st svg{width:11px;height:11px}
.st.new{background:var(--infoBg);color:var(--info)}.st.confirmed{background:var(--surf2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.st.enroute{background:var(--warnBg);color:var(--warn)}.st.onsite{background:var(--warnBg);color:var(--warn)}
.st.act{background:var(--badBg);color:var(--bad)}.st.closed{background:var(--okBg);color:var(--ok)}

/* portal: map split */
.pm{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:0}
.mapw{position:relative;min-width:0;overflow:hidden;background:var(--land)}
.maphd{position:absolute;left:24px;top:22px;right:24px;display:flex;gap:16px;align-items:flex-start;pointer-events:none}
.maphd .t{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);pointer-events:auto;max-width:430px}
.maphd h1{font-size:28px;line-height:1.1}
.maphd p{margin:6px 0 0;color:var(--ink2);font-size:14px}
.legend{position:absolute;left:24px;bottom:22px;display:flex;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;font-size:13px;color:var(--ink2);box-shadow:var(--sh)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.mapw{container-type:size}
.mapin{position:absolute;left:50%;top:50%;width:max(100cqw,calc(100cqh * 600 / 420));aspect-ratio:600/420;transform:translate(-50%,-50%)}
.mapin svg.map{position:absolute;inset:0;width:100%;height:100%}
.ovl{position:absolute;inset:0}
.dl{position:absolute;transform:translate(-50%,-50%);font-size:12px;color:var(--ink3);white-space:nowrap;pointer-events:none}
.dl.it{font-style:italic;font-size:11px}
.base{position:absolute;transform:translate(-11px,-50%);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);pointer-events:none}
.base i{width:22px;height:24px;background:var(--pin);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.pin{position:absolute;transform:translate(-14px,-100%);display:flex;align-items:center;gap:7px;padding-bottom:8px}
.pin::after{content:"";position:absolute;left:8px;bottom:0;border:6px solid transparent;border-top:8px solid var(--pin);border-bottom:0}
.pin .sq{width:28px;height:28px;border-radius:4px;background:var(--surf);border:2px solid var(--pin);display:grid;place-items:center;font-weight:700;font-size:13px;transition:background .15s,transform .15s}
.pin:hover .sq{transform:translateY(-2px)}
.pin .lbl{font-size:13px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--land) 80%,transparent);padding:2px 6px;border-radius:4px;white-space:nowrap}
.pin.on .sq{background:var(--act);border-color:#16150D;color:#16150D}
.pin.on .lbl{background:var(--sel);color:var(--selInk)}
.intro .pin{animation:drop .5s var(--d) cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{opacity:0;transform:translate(-14px,calc(-100% - 18px))}to{opacity:1;transform:translate(-14px,-100%)}}
.brg{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;transition:left 1s linear,top 1s linear;z-index:2;pointer-events:none}
.brg i{width:18px;height:18px;border-radius:50%;background:var(--act);border:2px solid #16150D;box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 35%,transparent)}
.brg b{background:#16150D;color:#FFC21A;font-size:12px;font-weight:600;padding:3px 7px;border-radius:4px;white-space:nowrap;transform:translate(4px,-14px)}
.route{stroke:#16150D;stroke-width:2;stroke-dasharray:5 6;fill:none;opacity:.55}
:root[data-theme="dark"] .route{stroke:#FFC21A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .route{stroke:#FFC21A}}
.side{background:var(--surf);border-left:1px solid var(--line);overflow:auto;min-height:0;padding:22px 22px 28px;display:flex;flex-direction:column;gap:18px}
.intro .side{animation:slideIn .6s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.objtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.objtabs button{flex:none;padding:7px 11px;border-radius:5px;font-size:13px;font-weight:500;background:var(--surf2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.objtabs button.on{background:var(--sel);color:var(--selInk);box-shadow:none}
.ob h2{font-size:24px;line-height:1.15}
.ob .ad{color:var(--ink2);font-size:14px;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{padding:10px 12px;border-right:1px solid var(--line)}.facts div:last-child{border-right:0}
.facts b{display:block;font:600 18px/1.1 var(--fd)}.facts span{font-size:12px;color:var(--ink2)}
.visit{border:1px solid var(--line);border-radius:var(--r);padding:16px}
.visit .top{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;margin-bottom:12px;flex-wrap:wrap}
.visit .when{font:600 17px/1.2 var(--fd);white-space:nowrap}
.visit .brig{font-size:13px;color:var(--ink2);margin-bottom:14px}
.eta{display:flex;align-items:baseline;gap:8px;box-shadow:inset 0 0 0 1px var(--line2);background:var(--brand);color:var(--brandInk);border-radius:6px;padding:12px 14px;margin-bottom:14px}
.eta b{font:600 34px/1 var(--fd);color:var(--act);white-space:nowrap}.eta em{font:600 16px var(--fd);font-style:normal;color:var(--act);margin-right:8px}.eta span{font-size:13px;opacity:.85}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:7px 0;position:relative;font-size:14px;color:var(--ink3)}
.steps li:not(:last-child)::before{content:"";position:absolute;left:10px;top:24px;bottom:-6px;width:2px;background:var(--line)}
.steps li .dt{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--surf);display:grid;place-items:center}
.steps li.done{color:var(--ink)}.steps li.done .dt{background:var(--ink);border-color:var(--ink);color:var(--surf)}
.steps li.done:not(:last-child)::before{background:var(--ink)}
.steps li.cur{color:var(--ink);font-weight:600}.steps li.cur .dt{border-color:var(--act);background:var(--act)}
.steps li time{font-size:13px;color:var(--ink2)}
.up h3{font-size:16px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.row .gr{flex:1;min-width:0}.row .gr b{display:block;font-weight:600}.row .gr span{color:var(--ink2);font-size:13px}

/* tables & pages */
.pg{padding:28px;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.pg h1{font-size:30px}
.pg .sub{color:var(--ink2);margin-top:4px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--ink2);font-size:13px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}.tbl tbody tr:hover{background:var(--surf2)}
.tbl .num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.flash{animation:flash 2s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--act) 38%,transparent)}100%{background:transparent}}
.acts{display:grid;gap:12px}
.actc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px}
.actc .ic{width:44px;height:52px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;color:var(--ink2);position:relative;background:var(--surf2)}
.actc .ic::after{content:"";position:absolute;right:-1.5px;top:-1.5px;border:7px solid transparent;border-right-color:var(--surf);border-top-color:var(--surf)}
.actc b{font-weight:600}.actc .m{font-size:13px;color:var(--ink2)}
.acta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* drawer & modal */
.ov{position:absolute;inset:0;z-index:40;background:rgba(10,14,15,.42);animation:fadeIn .2s both;display:flex;justify-content:flex-end}
.ov.closing{animation:fadeOut .2s both}
@keyframes fadeOut{to{opacity:0}}
.dr{width:min(560px,100%);height:100%;background:var(--surf);display:grid;grid-template-rows:auto 1fr auto;animation:drIn .32s cubic-bezier(.2,.8,.2,1) both}
.ov.closing .dr{animation:drOut .2s both}
@keyframes drIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes drOut{to{transform:translateX(40px);opacity:0}}
.drh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drh h2{font-size:21px;flex:1}
.x{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:var(--ink2)}.x:hover{background:var(--surf2)}
.drb{overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:20px;min-height:0}
.drf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--surf)}
.drf .tot{flex:1;min-width:0}.drf .tot b{font:600 24px/1 var(--fd);display:block}.drf .tot span{font-size:12px;color:var(--ink2)}
.prog{display:flex;gap:6px;padding:0 22px 0;margin-top:-1px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:2px}.prog i.on{background:var(--ink)}
.fl{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.fl em{font-style:normal;font-weight:400;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:6px;background:var(--surf2);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;min-height:40px;transition:background .15s,box-shadow .15s}
.chip.on{background:var(--sel);color:var(--selInk);box-shadow:none}
.chip small{display:block;font-size:12px;font-weight:400;opacity:.75}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ty{text-align:left;border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:var(--surf);transition:box-shadow .15s,transform .15s}
.ty:hover{transform:translateY(-2px)}
.ty.on{box-shadow:inset 0 0 0 2px var(--ink)}
.ty svg{display:block;width:100%;height:84px}
.ty div{padding:8px 10px 10px}.ty b{display:block;font-size:14px}.ty span{font-size:12px;color:var(--ink2)}
.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--surf);font-size:16px}
.inp.err{border-color:var(--bad)}
.er{color:var(--bad);font-size:13px;margin-top:6px}
.arow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.chk span{flex:1}.chk em{font-style:normal;color:var(--ink2);font-size:13px}
.calc{background:var(--surf2);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--ink2);display:grid;gap:4px}
.calc div{display:flex;justify-content:space-between;gap:10px}.calc b{color:var(--ink);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.slot{padding:10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;background:var(--surf);transition:background .15s}
.slot b{display:block;font:600 16px/1.1 var(--fd);white-space:nowrap}.slot span{font-size:12px;color:var(--ink2)}
.slot.on{background:var(--sel);color:var(--selInk);box-shadow:none}.slot.on span{color:var(--selInk);opacity:.8}
.slot.few span{color:var(--warn);font-weight:600}.slot.on.few span{color:var(--selInk)}
.sum{border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.sum div:last-child{border:0}
.sum span{color:var(--ink2)}.sum b{text-align:right}
.ok{display:grid;place-items:center;text-align:center;gap:10px;padding:30px 10px}
.ok .big{width:64px;height:64px;border-radius:50%;background:var(--okBg);color:var(--ok);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ok h2{font-size:24px}.ok p{color:var(--ink2);margin:0;max-width:360px}
.md{margin:auto;width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);background:var(--surf);border-radius:12px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;animation:mdIn .26s cubic-bezier(.2,.8,.2,1) both}
.ov.center{justify-content:center;align-items:center}
@keyframes mdIn{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.works{display:grid;gap:6px}.works div{display:flex;gap:8px;align-items:center;font-size:14px}.works .i{color:var(--ok)}

/* toast */
.toast{position:absolute;left:50%;bottom:24px;z-index:60;transform:translateX(-50%);background:var(--brand);color:var(--brandInk);padding:12px 16px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:500;box-shadow:var(--sh);animation:tin .25s both;max-width:calc(100% - 32px)}
.toast .i{color:var(--act)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}

/* admin */
.adh{background:var(--brand);color:var(--brandInk);border-bottom:0}
.adh .logo span{color:color-mix(in srgb,var(--brandInk) 70%,transparent)}
.adh .logo .mk{background:var(--act);color:#16150D}
.adh .nav button{color:color-mix(in srgb,var(--brandInk) 72%,transparent)}
.adh .nav button:hover{background:var(--brand2);color:var(--brandInk)}
.adh .nav button.on{background:var(--brand2);color:var(--brandInk);box-shadow:inset 0 -2px 0 var(--act)}
.adh .who{color:color-mix(in srgb,var(--brandInk) 72%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px}
.kpi span{font-size:13px;color:var(--ink2);display:flex;gap:7px;align-items:center}
.kpi b{display:block;font:600 32px/1.1 var(--fd);margin:8px 0 4px}
.kpi small{font-size:12px;font-weight:600}.kpi small.up{color:var(--ok)}.kpi small.dn{color:var(--bad)}
.kpi.main{background:var(--act);border-color:var(--act);color:#16150D}.kpi.main span,.kpi.main small{color:#16150D}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.gc{padding:16px 18px 18px}
.gch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gch h2{font-size:19px;flex:1}
.gantt{overflow-x:auto}
.gin{min-width:720px}
.gax{display:grid;grid-template-columns:150px 1fr;font-size:12px;color:var(--ink3)}
.gax .hrs{position:relative;height:20px}
.gax .hrs span{position:absolute;transform:translateX(-50%)}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:stretch;border-top:1px solid var(--line);min-height:54px}
.grow .bn{padding:8px 10px 8px 0;font-size:13px}.grow .bn b{display:block;font-size:14px}.grow .bn span{color:var(--ink2);font-size:12px}
.gl{position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px),var(--line) calc(100%/12))}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.now.lab::before{content:"11:00";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--bad)}
.job{position:absolute;top:6px;bottom:6px;border-radius:5px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;text-align:left;border-left:4px solid;transition:transform .15s,box-shadow .15s;transform-origin:left center}
.job:hover{transform:translateY(-1px);box-shadow:var(--sh);z-index:3}
.job b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.job span{white-space:nowrap;opacity:.8}
.job.confirmed{background:var(--surf2);border-color:var(--ink);color:var(--ink)}
.job.enroute,.job.onsite{background:var(--warnBg);border-color:var(--warn);color:var(--ink)}
.job.act,.job.closed{background:var(--okBg);border-color:var(--ok);color:var(--ink)}
.job.new{background:var(--infoBg);border-color:var(--info);color:var(--ink)}
.grow-in .job{animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.att{padding:16px 18px}
.att h2{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.ai .ic{width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.ai .ic.b{background:var(--infoBg);color:var(--info)}.ai .ic.r{background:var(--badBg);color:var(--bad)}.ai .ic.w{background:var(--warnBg);color:var(--warn)}
.ai b{font-weight:600;display:block}.ai span{color:var(--ink2);font-size:13px}
.ai .btn{margin-top:8px}
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surf2);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:14px;font-family:var(--fb);font-weight:600;display:flex;justify-content:space-between;padding:2px 4px 4px}
.col h3 span{color:var(--ink2)}
.bc{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:10px 11px;text-align:left;font-size:13px;display:grid;gap:3px;transition:transform .15s,box-shadow .15s}
.bc:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.bc b{font-size:14px}.bc span{color:var(--ink2)}
.bc .pr{display:flex;justify-content:space-between;margin-top:4px;color:var(--ink);font-weight:600}
.tar{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.tc{padding:14px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.tc svg{width:96px;height:72px;border-radius:6px}
.tc>div{min-width:0}.tc b{display:block}.tc .tin{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.tc .tin .inp{width:96px;min-height:40px;font-size:15px}
.tc small{color:var(--ink2)}
.bopt{display:grid;gap:8px}
.bopt button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:background .15s}
.bopt button:hover{background:var(--surf2)}
.bopt button b{display:block}.bopt button span{font-size:13px;color:var(--ink2)}
.bopt button.busy{opacity:.45;pointer-events:none}

/* demo console */
.pult{border:1px solid #2A363B;position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:4px;padding:6px;background:#10161A;border-radius:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.55)}
.pult button{width:46px;height:46px;border-radius:9px;color:#9FB0AE;display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.pult button:hover{background:#1E2A2F;color:#fff}
.pult button.on{background:#FFC21A;color:#16150D}
.pult hr{border:0;height:1px;background:#26343A;margin:3px 6px}
.pult button::after{content:attr(data-tip);position:absolute;right:56px;top:50%;transform:translateY(-50%);background:#10161A;color:#fff;font-size:12px;font-weight:500;padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.pult button:hover::after{opacity:1}
.tour{position:fixed;right:76px;top:50%;transform:translateY(-50%);z-index:101;width:300px;background:#10161A;color:#E8EDEB;border-radius:12px;padding:16px 18px;font-size:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.6);animation:fadeIn .2s both}
.tour b{font:600 17px var(--fd);display:block;margin-bottom:8px}
.tour ol{margin:0;padding-left:18px;display:grid;gap:6px;color:#C3CFCD}
.tour p{margin:10px 0 0;font-size:12px;color:#8A9896}
.gear{display:none}
@media (max-width:760px){
  .pult{top:auto;bottom:auto;right:10px;top:10px;transform:none;flex-direction:row;display:none}
  .pult.open{display:flex;flex-direction:column;top:auto;bottom:134px;right:12px}
  .pult [data-a="dev"]{display:none}
  .pult button::after{display:none}
  .gear{display:grid;position:fixed;right:12px;bottom:82px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);z-index:101;width:44px;height:44px;border-radius:10px;background:#10161A;color:#FFC21A;place-items:center}
  .tour{right:10px;left:10px;width:auto;top:auto;bottom:16px;transform:none}
}
.stage.phone ~ .gear{display:none}
.gear[hidden]{display:none!important}

/* mobile layout via container */
.bnav{display:none}
@container (max-width:900px){
  .pm{grid-template-columns:minmax(0,1fr) 340px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .who span{display:none}
}
@container (max-width:760px){
  .tar{grid-template-columns:minmax(0,1fr)}
  .hd{padding:10px 16px;gap:10px}
  .hd .nav,.hd .who{display:none}
  .hd .btn.y .lb{display:none}
  .hd .btn.y{width:44px;padding:0}
  .bnav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surf);border-top:1px solid var(--line);padding:4px 6px 8px}
  .bnav.a4{grid-template-columns:repeat(4,1fr)}
  .bnav button{display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--ink2);font-weight:500;position:relative;min-height:48px}
  .bnav button.on{color:var(--ink)}
  .bnav button.on .i{color:var(--ink)}
  .bnav button.on::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:3px;background:var(--act);border-radius:0 0 3px 3px}
  .bnav .bdg{position:absolute;top:2px;left:calc(50% + 6px);height:16px;min-width:16px;font-size:10px}
  .pm{display:block;height:auto}
  .mapw{height:330px}
  .maphd{left:12px;right:12px;top:12px}
  .maphd .t{padding:10px 12px}
  .maphd{display:none}
  .legend{left:12px;bottom:10px;font-size:11px;gap:8px;padding:6px 9px}
  .side{border-left:0;padding:16px;overflow:visible}
  .pg{padding:16px;gap:14px}
  .pg h1{font-size:24px}
  .actc{grid-template-columns:auto minmax(0,1fr);padding:14px}
  .acta{grid-column:1/-1;justify-content:stretch}.acta .btn{flex:1}
  .kpi{padding:12px 14px}.kpi b{font-size:22px;white-space:nowrap}.kpi span{font-size:12px}.kpi small{font-size:11px}
  .gch span{display:none}
  .gax,.grow{grid-template-columns:92px 1fr}.grow .bn b{font-size:13px}
  .dr{width:100%;height:94%;margin-top:auto;border-radius:16px 16px 0 0;animation-name:shIn}
  .ov.closing .dr{animation-name:shOut}
  .ov{align-items:flex-end}
  .drb{padding:16px}.drh{padding:14px 16px}.drf{padding:12px 16px}
  .arow{grid-template-columns:1fr}
  .tbl.rsp thead{display:none}
  .tbl.rsp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tbl.rsp td{padding:0;border:0}
  .tbl.rsp td.hm{display:none}
  .gc,.att{padding:14px}
  .toast{bottom:76px}
  .board{grid-template-columns:repeat(6,minmax(220px,1fr))}
}
@keyframes shIn{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes shOut{to{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

(function(){

const ic=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ')+' ₽';
const num=n=>Math.round(n).toLocaleString('ru-RU');
const hh=h=>{const m=Math.round((h%1)*60);return Math.floor(h)+':'+(m<10?'0':'')+m};
const DAYS=['Чт, 5 ноября','Пт, 6 ноября','Сб, 7 ноября','Пн, 9 ноября','Вт, 10 ноября'];
const DSHORT=['Сегодня','Пт 6','Сб 7','Пн 9','Вт 10'];
const NOW=11;

const TYPES=[
 {id:'office',name:'Офис',rate:42,speed:220,bg:'#FFE69A'},
 {id:'mop',name:'ЖК, места общего пользования',short:'ЖК, МОП',rate:26,speed:400,bg:'#BFE6D3'},
 {id:'retail',name:'Торговая площадь',rate:48,speed:240,bg:'#C9DBF6'},

function mdSign(){
 const r=gid(S.modal.id);const m=S.modal;const valid=/^[A-Za-zА-Яа-яЁё\s.\-]{2,40}$/.test((m.who||'').trim())&&m.agree;
 const works=['Сухая и влажная уборка '+num(r.area)+' м²','Мытьё полов в холлах и лифтах','Вынос мусора, замена пакетов','Протирка перил, почтовых ящиков, дверей'].concat(r.extras.map(id=>EXTRAS.find(e=>e.id===id).name));
 return '<div class="ov center" data-a="ovclose"><div class="md" role="dialog" aria-modal="true" aria-label="Подписать акт"><div class="drh"><h2>'+esc(r.act)+'</h2><button class="x" data-a="close" aria-label="Закрыть">'+ic('x')+'</button></div><div class="drb"><div class="sum"><div><span>Объект</span><b>'+esc(where(r))+'</b></div><div><span>Дата</span><b>'+dayLbl(r.day)+', '+brig(r.b).n+'</b></div><div><span>Сумма</span><b>'+rub(r.price)+'</b></div></div><div><span class="fl">Выполнено</span><div class="works">'+works.map(w=>'<div>'+ic('check','s')+esc(w)+'</div>').join('')+'</div></div><div><span class="fl">ФИО подписанта</span><input class="inp" id="s-who" data-f="who" value="'+esc(m.who||'')+'" placeholder="Котова Ирина"></div><label class="chk"><input type="checkbox" data-f="agree"'+(m.agree?' checked':'')+'><span>Работы приняты, претензий нет</span></label></div><div class="drf"><button class="btn g" data-a="close">Позже</button><div class="sp"></div><button class="btn y" id="s-btn" data-a="doSign" data-id="'+r.id+'"'+(valid?'':' disabled')+'>'+ic('pen-line','s')+'Подписать акт</button></div></div></div>';
}

/* ---------- render ---------- */
const app=document.getElementById('app'),stage=document.getElementById('stage');
function render(){
 const ae=document.activeElement;const fid=ae&&ae.id&&app.contains(ae)?ae.id:null;const sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
 const ps=app.querySelector('.scr');const top=ps?ps.scrollTop:0;
 let h='',v='';
 if(S.view==='portal'){h=hdPortal();v=S.sub==='reqs'?vReqs():S.sub==='acts'?vActs():vMap();}
 else{h=hdAdmin();v=S.sub==='board'?vBoard():S.sub==='clients'?vClients():S.sub==='tariffs'?vTariffs():vToday();}
 const nav=S.view==='portal'?bnavPortal():bnavAdmin();
 let ov='';
 if(S.form)ov=drOrder();else if(S.modal&&S.modal.k==='req')ov=drReq();else if(S.modal&&S.modal.k==='sign')ov=mdSign();
 app.innerHTML=h+'<main class="scr">'+v+'</main>'+nav+ov+(S.toast?'<div class="toast" role="status">'+ic('circle-check')+esc(S.toast)+'</div>':'');
 const ns=app.querySelector('.scr');if(ns&&S.keepScroll)ns.scrollTop=top;S.keepScroll=false;
 if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
 S.intro=false;
 countUp();renderPult();
 if(S.view==='admin'&&S.sub==='today')S.counted.today=true;
}
function countUp(){
 if(S.view!=='admin'||S.sub!=='today'||S.counted.kpi)return;S.counted.kpi=true;
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 app.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,isR=el.dataset.rub,isP=el.dataset.pct;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/750),e=1-Math.pow(1-k,3),v=to*e;el.textContent=isR?rub(v):isP?Math.round(v)+'%':Math.round(v);if(k<1)requestAnimationFrame(f)})(t0)});
}
function renderPult(){
 const p=document.getElementById('pult');const gr=document.querySelector('.gear');if(gr)gr.hidden=!!(S.form||S.modal);
 p.className='pult'+(S.pultOpen?' open':'');
 p.innerHTML='<button data-a="view" data-v="portal" class="'+(S.view==='portal'?'on':'')+'" data-tip="Портал клиента" aria-label="Портал клиента">'+ic('building-2')+'</button><button data-a="view" data-v="admin" class="'+(S.view==='admin'?'on':'')+'" data-tip="Диспетчерская" aria-label="Диспетчерская">'+ic('gauge')+'</button><hr><button data-a="dev" data-v="pc" class="'+(S.dev==='pc'?'on':'')+'" data-tip="Версия для ПК" aria-label="Версия для ПК">'+ic('monitor')+'</button><button data-a="dev" data-v="phone" class="'+(S.dev==='phone'?'on':'')+'" data-tip="Версия для телефона" aria-label="Версия для телефона">'+ic('smartphone')+'</button><hr><button data-a="theme" data-tip="Светлая или тёмная тема" aria-label="Сменить тему">'+ic(isDark()?'sun':'moon')+'</button><button data-a="tour" class="'+(S.tour?'on':'')+'" data-tip="Что нажать" aria-label="Что нажать">'+ic('circle-help')+'</button>';
 document.getElementById('tourw').innerHTML=S.tour?'<div class="tour" role="dialog" aria-label="Что нажать"><b>Что нажать за 2 минуты</b><ol><li>На карте бригада едет к БЦ «Рубеж», время до приезда тикает.</li><li>«Заказать уборку»: посчитайте цену, выберите окно, отправьте.</li><li>Откройте диспетчерскую: заявка ждёт в «Требует внимания». Назначьте бригаду.</li><li>Передвиньте статус «Выехала», «На объекте», «Акт». Клиент видит это в портале.</li><li>В портале в «Актах» подпишите акт. В «Тарифах» смените цену за м².</li></ol><p>Данные вымышлены, ничего не сохраняется и никуда не отправляется.</p></div>':'';
}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
let tt;function toast(m){S.toast=m;clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;const el=app.querySelector('.toast');if(el)el.remove()},2600)}
function flash(id){S.flash=id;setTimeout(()=>{if(S.flash===id)S.flash=null},2100)}
function closeOv(){const ov=app.querySelector('.ov');S.form=null;S.modal=null;if(ov&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){ov.classList.add('closing');setTimeout(render,190)}else render()}

/* ---------- routing ---------- */
const ROUTES={'portal':['portal','map'],'portal-requests':['portal','reqs'],'portal-acts':['portal','acts'],'admin':['admin','today'],'admin-board':['admin','board'],'admin-clients':['admin','clients'],'admin-tariffs':['admin','tariffs']};
function routeName(){for(const k in ROUTES){if(ROUTES[k][0]===S.view&&ROUTES[k][1]===S.sub)return k}return 'portal'}
function go(view,sub,push){S.view=view;S.sub=sub;S.counted.kpi=false;if(sub!=='today')S.counted.today=false;const h=routeName();try{if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h)}catch(e){}render()}
function fromHash(){const h=(location.hash||'').slice(1);const r=ROUTES[h]||ROUTES.portal;S.view=r[0];S.sub=r[1]}
window.addEventListener('hashchange',()=>{fromHash();render()});

/* ---------- events ---------- */
function validate(f,step){f.err={};if(step===1){const a=+String(f.area).replace(/\s/g,'');if(!(a>=20&&a<=20000))f.err.area='Площадь от 20 до 20 000 м²';else f.area=a}
 if(step===2&&f.start==null)f.err.start='Выберите время';
 if(step===3){if(!/^[A-Za-zА-Яа-яЁё\s\-]{2,40}$/.test(f.name.trim()))f.err.name='Имя буквами, от 2 до 40 символов';const d=f.phone.replace(/\D/g,'');if(d.length<10||d.length>11)f.err.phone='Телефон: 10 или 11 цифр'}
 return !Object.keys(f.err).length}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-g="gear"]');if(g){S.pultOpen=!S.pultOpen;renderPult();return}
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,id=t.dataset.id,v=t.dataset.v;
 if(a==='ovclose'){if(e.target===t)closeOv();return}
 switch(a){
  case 'view':S.form=null;S.modal=null;S.tour=false;S.pultOpen=false;go(v,v==='admin'?'today':'map');break;
  case 'dev':S.dev=v;stage.classList.toggle('phone',v==='phone');S.pultOpen=false;render();break;
  case 'theme':document.documentElement.dataset.theme=isDark()?'light':'dark';render();break;
  case 'tour':S.tour=!S.tour;renderPult();break;
  case 'sub':go(S.view,v);break;
  case 'sel':S.sel=id;S.keepScroll=true;render();break;
  case 'order':S.form=newForm(t.dataset.obj?{obj:t.dataset.obj}:null);render();break;
  case 'repeat':{const r=gid(id);S.form=newForm(r);render();break}
  case 'close':closeOv();break;
  case 'f':{const f=S.form;const k=t.dataset.k;if(k==='day'){f.day=+v;f.start=null}else if(k==='start'){f.start=+v}else{f[k]=v;if(k==='obj'){const o=obj(v);f.area=o.area;f.type=o.type}}f.err={};render();break}
  case 'next':{const f=S.form;if(!validate(f,f.step)){render();break}if(f.step===1){const d=durOf(f);if(!slotsFor(f.day,d).length)f.day=[1,2,3,4,0].find(x=>slotsFor(x,d).length)||1}f.step++;render();break}
  case 'back':S.form.step--;S.form.err={};render();break;
  case 'send':{const f=S.form;if(!validate(f,3)){render();break}const idn=String(S.nextId++);const P=priceOf(f);
   S.reqs.push({id:idn,cl:ME,obj:f.obj,type:f.type,area:f.area,freq:f.freq,extras:f.extras.slice(),day:f.day,start:f.start,dur:durOf(f),b:null,st:'new',ago:'только что',price:P.total,note:f.note.trim().slice(0,300),contact:f.name.trim(),log:{}});
   f.step=4;f.done=idn;flash(idn);render();break}
  case 'toAdmin':S.form=null;go('admin','today');break;
  case 'req':S.modal={k:'req',id};render();break;
  case 'assign':{const r=gid(id);if(!freeBrig(r.day,r.start,r.dur).some(b=>b.id===t.dataset.b))break;r.b=t.dataset.b;r.st='confirmed';r.log.confirmed='11:0'+(r.id%9);flash(id);S.modal=null;toast(brig(r.b).n+' назначена. Клиент видит подтверждение');render();break}
  case 'adv':{const r=gid(id);r.st=v;r.log[v]='11:'+String(10+(+r.id%40)).padStart(2,'0');if(v==='enroute')S.travel[id]={p:0};if(v==='act'){r.act='АКТ-'+(419+(+id%50));r.day=Math.min(r.day,0)}flash(id);S.modal=null;toast({enroute:'Клиент видит бригаду на карте',onsite:'Статус «В работе» у клиента',act:'Акт '+(r.act||'')+' ушёл клиенту на подпись'}[v]);render();break}
  case 'remind':toast('Напоминание о подписи отправлено клиенту');S.modal=null;render();break;
  case 'sign':S.modal={k:'sign',id,who:'',agree:false};render();break;
  case 'doSign':{const m=S.modal;const r=gid(id);if(!(/^[A-Za-zА-Яа-яЁё\s.\-]{2,40}$/.test((m.who||'').trim())&&m.agree))break;r.st='closed';r.signed=m.who.trim();flash(id);S.modal=null;toast('Акт '+r.act+' подписан');render();break}
  case 'saveT':{const tp=TYPES.find(x=>x.id===id);const raw=String(S.tariffEdits[id]!=null?S.tariffEdits[id]:tp.rate).replace(/\s/g,'');const n=+raw;if(!(n>=5&&n<=500)){S.tariffEdits[id]=raw;render();break}tp.rate=Math.round(n);delete S.tariffEdits[id];toast('Тариф «'+(tp.short||tp.name)+'»: '+tp.rate+' ₽/м², калькулятор обновлён');render();break}
 }
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.pin')){e.preventDefault();S.sel=e.target.dataset.id;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.form||S.modal))closeOv()});
app.addEventListener('input',e=>{
 const t=e.target,k=t.dataset.f;if(!k)return;
 if(S.form){const f=S.form;
  if(k==='area'){const n=+String(t.value).replace(/\D/g,'');f.area=t.type==='range'?n:String(t.value).replace(/[^\d]/g,'').slice(0,6);const other=document.getElementById(t.type==='range'?'f-area':'f-range');if(other)other.value=t.type==='range'?n:Math.min(5000,Math.max(50,n||50));if(t.type!=='range'&&t.value!==String(f.area))t.value=f.area;updPrice();return}
  if(k==='extra'){const id=t.value;f.extras=t.checked?f.extras.concat(id):f.extras.filter(x=>x!==id);updPrice();return}
  if(k==='name'||k==='phone'||k==='note'){f[k]=t.value.slice(0,k==='note'?300:40);return}
 }
 if(S.modal&&S.modal.k==='sign'){if(k==='who')S.modal.who=t.value.slice(0,40);if(k==='agree')S.modal.agree=t.checked;const ok=/^[A-Za-zА-Яа-яЁё\s.\-]{2,40}$/.test((S.modal.who||'').trim())&&S.modal.agree;const b=document.getElementById('s-btn');if(b)b.disabled=!ok;return}
 if(k==='tariff'){S.tariffEdits[t.dataset.id]=t.value.replace(/[^\d]/g,'').slice(0,4);if(t.value!==S.tariffEdits[t.dataset.id])t.value=S.tariffEdits[t.dataset.id];return}
});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.f==='agree'&&S.modal){S.modal.agree=t.checked;const ok=/^[A-Za-zА-Яа-яЁё\s.\-]{2,40}$/.test((S.modal.who||'').trim())&&S.modal.agree;const b=document.getElementById('s-btn');if(b)b.disabled=!ok}});
function updPrice(){const f=S.form;const ok=+f.area>=20&&+f.area<=20000;const P=priceOf(Object.assign({},f,{area:ok?+f.area:0}));const a=document.getElementById('ptot'),b=document.getElementById('pdur'),c=document.getElementById('calcbox');if(a)a.textContent=ok?rub(P.total):'—';if(b)b.textContent=ok?'примерно '+durOf(f)+' ч работы бригады':'укажите площадь от 20 до 20 000 м²';if(c&&ok)c.innerHTML=calcRows(f)}

/* ---------- live travel ---------- */
setInterval(()=>{
 let changed=false;
 Object.keys(S.travel).forEach(id=>{const r=gid(id);if(!r||r.st!=='enroute')return;const tr=S.travel[id];tr.p=Math.min(1,tr.p+.012);
  if(tr.p>=1){r.st='onsite';r.log.onsite='11:'+String(20+(+id%30)).padStart(2,'0');changed=true;if(r.cl===ME)toast(brig(r.b).n+' приехала: '+where(r));return}
  const g=document.getElementById('brg-'+id);if(g){const q=brgPos(r);g.style.left=(q.x/6).toFixed(2)+'%';g.style.top=(q.y/4.2).toFixed(2)+'%';const tx=g.querySelector('b');if(tx)tx.textContent=brgLab(r)}
  const e=document.getElementById('eta-'+id);if(e)e.textContent=eta(r);
 });
 if(changed){const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))&&!S.form&&!S.modal){S.keepScroll=true;render()}}
},1000);

fromHash();render();
})();
</script>
</body>
</html>
