<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Трасса: рейсы, водители и счета (демо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@500;600;700&display=swap">
<style>

/* Каркас: лента-таймлайн + доска рейсов + чат водителя. Палитра: петроль и разметочный жёлтый. Язык форм: линейка, тонкие линии, прямые углы. */
:root{
  --bg:#EDF0F2;--panel:#FFFFFF;--soft:#E2E7EA;--ink:#11181C;--ink2:#46555D;--line:#C9D2D7;--edge:#11181C;
  --brand:#0F5A73;--brandInk:#F2FAFC;--act:#FFC20E;--actInk:#1B1500;--sel:#0F5A73;--selInk:#FFFFFF;
  --good:#1B7448;--bad:#B3321F;--warn:#8F5B00;--hl:#FFF0B8;--map:#DCE6E7;--water:#B9D3DC;--road:#FFFFFF;--roadEdge:#B8C4C9;
  --s-new:#53636C;--s-asg:#2F66B0;--s-load:#97600A;--s-way:#0F5A73;--s-unl:#B1451C;--s-done:#1B7448;
  --fd:'Oswald','Arial Narrow',system-ui,sans-serif;--fb:'Source Sans 3','Segoe UI',system-ui,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1216;--panel:#131D23;--soft:#1B2830;--ink:#E6EEF1;--ink2:#9DB0B9;--line:#27373F;--edge:#7C95A0;
  --brand:#14708C;--brandInk:#F2FAFC;--act:#FFC20E;--actInk:#1B1500;--sel:#E6EEF1;--selInk:#0B1216;
  --good:#5CC58A;--bad:#F37B68;--warn:#F0B04A;--hl:#3F3512;--map:#14242B;--water:#1D3A47;--road:#2A3C45;--roadEdge:#0B1519;
  --s-new:#9DB0B9;--s-asg:#7DAEF0;--s-load:#F0B04A;--s-way:#5FC1E0;--s-unl:#F4906A;--s-done:#5CC58A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1216;--panel:#131D23;--soft:#1B2830;--ink:#E6EEF1;--ink2:#9DB0B9;--line:#27373F;--edge:#7C95A0;
  --brand:#14708C;--brandInk:#F2FAFC;--act:#FFC20E;--actInk:#1B1500;--sel:#E6EEF1;--selInk:#0B1216;
  --good:#5CC58A;--bad:#F37B68;--warn:#F0B04A;--hl:#3F3512;--map:#14242B;--water:#1D3A47;--road:#2A3C45;--roadEdge:#0B1519;
  --s-new:#9DB0B9;--s-asg:#7DAEF0;--s-load:#F0B04A;--s-way:#5FC1E0;--s-unl:#F4906A;--s-done:#5CC58A;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--fb);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fd);margin:0;font-weight:600;line-height:1.1;letter-spacing:.005em}
p{margin:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

#stage{position:relative;min-height:100vh}
#frame{container:app/inline-size;background:var(--bg);min-height:100vh}
@media (min-width:521px){
  body:not(.clean) #stage:not(.phone){padding-right:96px}
  #stage.phone{width:390px;height:800px;margin:16px auto 0;border:1px solid var(--edge);border-radius:28px;overflow:hidden;transform:translateZ(0);box-shadow:0 0 0 8px var(--soft);min-height:0}
  #stage.phone #frame{height:100%;min-height:0;overflow-y:auto;scrollbar-width:none}
  body.phonemode{background:var(--soft)}
}

/* кнопки: прямые углы, тонкая линия */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--edge);border-radius:3px;background:var(--panel);font-weight:700;transition:transform .12s,background .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.cta{background:var(--act);color:var(--actInk);border-color:var(--actInk);min-height:48px;padding:0 22px;font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:.02em}
.btn.cta:hover{background:#FFD24A}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.ghost{border-color:var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.ibtn:hover{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 9px 0 7px;border:1px solid var(--c);color:var(--c);border-radius:2px;font-weight:700;font-size:14px;white-space:nowrap;background:var(--panel)}
.chip .ic{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 8px;border-radius:2px;font-size:13px;font-weight:700;background:var(--hl);color:var(--ink);border:1px solid var(--warn)}
.demo-note{font-size:13px;color:var(--ink2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--fd);font-size:18px;font-weight:500}
.ph small{font:600 14px var(--fb);color:var(--ink2);margin-left:auto}
.pb{padding:16px}

/* ====== КЛИЕНТ ====== */
.cl{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{display:none}
@container app (min-width:900px){
  .cl{grid-template-columns:216px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh}
}
.brand{display:flex;align-items:center;gap:10px;font:700 24px var(--fd);letter-spacing:.02em;min-height:44px;padding:0 6px 10px}
.brand i{width:32px;height:32px;background:var(--act);color:var(--actInk);display:grid;place-items:center;border:1px solid var(--actInk)}
.brand i .ic{width:20px;height:20px}
.rnav{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:3px;font-weight:700;position:relative}
.rnav:hover{background:var(--soft)}
.rnav[aria-current="page"]{background:var(--sel);color:var(--selInk)}
.rnav .badge{margin-left:auto;font-size:13px;padding:1px 7px;border:1px solid currentColor;border-radius:2px}
.rco{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:3px;font-size:14px;color:var(--ink2)}
.rco b{display:block;color:var(--ink);font:600 17px var(--fd);margin-bottom:2px}
.cmain{padding:16px 16px 92px;min-width:0;display:flex;flex-direction:column;gap:16px}
@container app (min-width:900px){.cmain{padding:24px 32px 40px;gap:20px}}
.mtop{display:flex;align-items:center;gap:10px}
.mtop .brand{padding:0;margin-right:auto}
@container app (min-width:900px){.mtop{display:none}}
.bnav{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--edge);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));margin-top:auto}
.bnav button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700;border-radius:3px;color:var(--ink2)}
.bnav button[aria-current="page"]{background:var(--sel);color:var(--selInk)}
@container app (min-width:900px){.bnav{display:none}}
.cl>div:last-child{min-width:0;display:flex;flex-direction:column}

.hero{position:relative;overflow:hidden;background:var(--brand);color:var(--brandInk);border-radius:3px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--edge)}
@container app (min-width:900px){.hero{padding:28px 32px 26px;gap:16px}}
.hero .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.hero .top .tag{background:rgba(255,255,255,.14);color:var(--brandInk);border-color:rgba(255,255,255,.45)}
.hero h1{font-size:clamp(40px,13cqw,60px);font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.01em;position:relative;z-index:1}
@container app (min-width:900px){.hero h1{font-size:72px}}
.hero .sub{font-size:18px;font-weight:600;max-width:36ch;position:relative;z-index:1}
.hero .route{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600;opacity:.92;position:relative;z-index:1}
.hero .art{position:absolute;right:-10px;top:26px;width:330px;height:auto;opacity:.95;display:none}
@container app (min-width:900px){.hero .art{display:block}}
.ruler{position:relative;height:94px;margin:6px 4px 0;z-index:1}
.rl-line{position:absolute;left:0;right:0;top:38px;height:8px;background:rgba(255,255,255,.28);border-radius:1px}
.rl-done{position:absolute;left:0;top:0;bottom:0;background:var(--act);width:0}
.rl-ticks{position:absolute;left:0;right:0;top:50px;height:12px;background-image:linear-gradient(90deg,rgba(242,250,252,.8) 1px,transparent 1px);background-size:10% 100%;border-right:1px solid rgba(242,250,252,.8)}
.rl-ticks::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background-image:linear-gradient(90deg,rgba(242,250,252,.55) 1px,transparent 1px);background-size:2% 100%}
.rl-truck{position:absolute;top:18px;width:46px;height:40px;margin-left:-23px;display:grid;place-items:center;background:var(--act);color:var(--actInk);border:1px solid var(--actInk);border-radius:3px}
.rl-truck .ic{width:26px;height:26px}
.rl-ab{position:absolute;left:0;right:0;top:68px;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.rl-left{position:absolute;left:0;top:0;font:600 18px var(--fd);letter-spacing:.02em}
.rl-tot{position:absolute;right:0;top:3px;font:600 14px var(--fb);opacity:.85}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container app (min-width:900px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}}
.tl{list-style:none;margin:0;padding:6px 0;position:relative}
.tl li{display:grid;grid-template-columns:36px 1fr auto;gap:0 10px;padding:10px 16px;position:relative;min-height:56px;align-items:start}
.tl li::before{content:"";position:absolute;left:33px;top:0;bottom:0;width:1px;background:var(--line)}
.tl li:first-child::before{top:24px}.tl li:last-child::before{bottom:calc(100% - 24px)}
.tl .nd{width:22px;height:22px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;margin:2px 0 0 6px;position:relative;z-index:1;border-radius:2px;color:var(--panel)}
.tl .nd .ic{width:15px;height:15px;stroke-width:2.5}
.tl li.done .nd{background:var(--good);border-color:var(--good)}
.tl li.cur{background:var(--hl)}
.tl li.cur .nd{background:var(--act);border-color:var(--actInk);color:var(--actInk)}
.tl li.todo{color:var(--ink2)}
.tl b{font:500 18px var(--fd)}
.tl .when{font-weight:700;font-variant-numeric:tabular-nums}
.tl small{display:block;color:var(--ink2);font-size:14px;margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--ink2);font-size:14px;padding-top:2px}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.invbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.invbox b{font:600 20px var(--fd)}
.invbox .btn{margin-left:auto}

/* карта: схема + HTML-подписи */
.mapbox{position:relative;aspect-ratio:5/3;background:var(--map);overflow:hidden;border-bottom:1px solid var(--line);isolation:isolate}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.mapbox .tn{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;background:var(--panel);border:1.5px solid var(--ink)}
.mapbox .tn.hub{width:13px;height:13px;background:var(--ink)}
.mapbox .tl-lbl{position:absolute;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px var(--map),0 0 3px var(--map),0 0 3px var(--map);transform:translate(-50%,-50%);pointer-events:none}
.mapbox .pin{position:absolute;transform:translate(-50%,-100%);color:var(--panel);background:var(--ink);padding:3px 7px;font-size:13px;font-weight:700;white-space:nowrap}
.mapbox .pin.b{background:var(--brand);color:var(--brandInk)}
.mk{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;display:grid;place-items:center;background:var(--act);color:var(--actInk);border:1px solid var(--actInk);border-radius:3px;transition:left .9s linear,top .9s linear;z-index:3}
.mk .ic{width:22px;height:22px}
.mk.sm{width:30px;height:30px;margin:-15px 0 0 -15px}
.mk.sm .ic{width:18px;height:18px}
.mk.sel{outline:2px solid var(--ink);outline-offset:2px}
.mklbl{position:absolute;transform:translate(-50%,16px);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);padding:0 5px;white-space:nowrap;z-index:2}
.maplg{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:14px;color:var(--ink2)}
.maplg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--brand);vertical-align:middle;margin-right:6px}
.maplg i.d{border-top-style:dashed}

/* список рейсов клиента */
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-weight:700}
.fl button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.trows{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:70px minmax(0,1fr) auto 110px;gap:4px 14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;position:relative}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--soft)}
.trow .no{font:600 22px var(--fd)}
.trow .rt{font-weight:700;min-width:0}
.trow .rt small{display:block;color:var(--ink2);font-weight:600;font-size:14px}
.trow .pr{font:600 18px var(--fd);text-align:right}
.trow .ln{grid-column:1/-1;height:4px;background:var(--soft);position:relative}
.trow .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--s-way);width:0}
.trow.fl2{animation:flash 2s ease-out}
@container app (max-width:760px){.trow{grid-template-columns:60px minmax(0,1fr)}.trow .st{grid-column:1/-1}.trow .pr{text-align:left;grid-column:1/-1}}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@container app (max-width:760px){.sum3{grid-template-columns:minmax(0,1fr)}}
.st3{padding:14px 16px}
.st3 small{display:block;color:var(--ink2);font-size:14px}
.st3 b{font:600 32px var(--fd)}
.irow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow .am{font:600 20px var(--fd);text-align:right}
@container app (max-width:760px){.irow{grid-template-columns:minmax(0,1fr) auto}.irow .am{text-align:right}.irow .btn{grid-column:1/-1}}

/* ====== ДИСПЕТЧЕР ====== */
.adm{min-height:100vh;display:flex;flex-direction:column}
.ahd{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.ahd .brand{padding:0;margin-right:6px}
.atabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.atab{min-height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:700;border-radius:3px;white-space:nowrap}
.atab:hover{background:var(--soft)}
.atab[aria-current="page"]{background:var(--sel);color:var(--selInk)}
.atab .badge{font-size:13px;padding:0 6px;border:1px solid currentColor;border-radius:2px}
.awho{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:600}
.awho b{display:block;color:var(--ink);font-size:15px}
.awho i{width:36px;height:36px;display:grid;place-items:center;background:var(--soft);font:600 15px var(--fd);font-style:normal;border:1px solid var(--line)}
@container app (max-width:760px){.awho span{display:none}.ahd{gap:8px;padding:8px 12px}.ahd .brand span{display:none}}
.amain{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-height:0}
.amain.has-drawer{grid-template-columns:minmax(0,1fr) 404px}
.apage{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
@container app (min-width:900px){.apage{padding:20px 24px 40px}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@container app (max-width:1099px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:3px;border-top:3px solid var(--edge);min-width:0}
.kpi small{display:block;color:var(--ink2);font-size:14px;line-height:1.2;min-height:34px}
.kpi b{display:block;font:600 36px var(--fd);line-height:1.1;margin-top:2px}
.kpi b em{font:600 18px var(--fd);font-style:normal;margin-left:4px}
.dl{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:700;margin-top:2px}
.dl .ic{width:16px;height:16px}
.dl.good{color:var(--good)}.dl.bad{color:var(--bad)}.dl.flat{color:var(--ink2)}
.attn{border-left:4px solid var(--act)}
.arow{display:flex;align-items:center;gap:12px;padding:6px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.arow:first-of-type{border-top:0}
.arow .ic.k{color:var(--warn)}
.arow span{flex:1;min-width:200px;font-weight:600}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(192px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
@container app (max-width:899px){.board{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:minmax(0,1fr);overflow:visible}}
.col{background:var(--soft);border-radius:3px;border-top:3px solid var(--c);min-width:0;display:flex;flex-direction:column;gap:8px;padding:8px 8px 10px}
.col h3{font:500 17px var(--fd);display:flex;align-items:center;gap:8px;color:var(--ink);padding:2px 4px 0;min-height:28px}
.col h3 .ic{color:var(--c);width:18px;height:18px}
.col h3 span.n{margin-left:auto;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--panel);padding:0 7px;border-radius:2px}
.empty{color:var(--ink2);font-size:14px;padding:6px 4px 8px}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:3px;position:relative;transition:transform .15s,border-color .15s}
.tc:hover{transform:translateY(-2px);border-color:var(--ink2)}
.tc.sel{outline:2px solid var(--sel);outline-offset:1px}
.tc.flash{animation:flash 2s ease-out}
.tc-main{display:block;width:100%;padding:10px 12px 8px;min-height:44px}
.tc-main .no{font:600 20px var(--fd);display:flex;align-items:center;gap:8px}
.tc-main .cn{font-weight:700;font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-main .rt{font-size:15px;color:var(--ink2);margin-top:2px;font-weight:600}
.tc-main .mt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-top:4px;flex-wrap:wrap}
.tc .pbar{height:4px;background:var(--soft);margin:0 12px 6px;position:relative}
.tc .pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--s-way);width:0}
.tc-f{padding:0 12px 10px;display:flex;gap:8px;flex-wrap:wrap}
.tc .late{background:var(--bad);color:#fff;border-color:var(--bad)}
.drawer{background:var(--panel);border-left:1px solid var(--edge);display:flex;flex-direction:column;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto;min-width:0}
.dr-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dr-h h2{font-size:30px;font-weight:600}
.dr-h .cl2{color:var(--ink2);font-weight:600;font-size:15px}
.dr-h .ibtn{margin-left:auto}
.dr-s{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dr-s h4{font-size:17px;font-weight:500;color:var(--ink2)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;transition:transform .12s}
.seg button:hover{background:var(--soft)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.seg button[disabled]{opacity:.4;pointer-events:none}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:14px;font-weight:700;color:var(--ink2)}
.inp{min-height:44px;padding:0 12px;border:1px solid var(--edge);border-radius:3px;background:var(--panel);width:100%;min-width:0}
textarea.inp{padding:10px 12px;min-height:76px;resize:vertical}
.inp[aria-invalid="true"]{border-color:var(--bad);border-width:2px}
.err{color:var(--bad);font-size:14px;font-weight:700;min-height:0}
.row2{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row2 .fld{flex:1;min-width:140px}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.lg li{display:flex;gap:10px}.lg time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:44px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:500 15px var(--fd);text-align:left;color:var(--ink2);padding:10px 14px;border-bottom:1px solid var(--edge)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--soft)}
.tbl .r{text-align:right}
.tblw{overflow-x:auto}
@container app (max-width:760px){.tbl .hide-s{display:none}}
.dbars{display:flex;flex-direction:column;gap:8px}
.dbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;align-items:center;gap:10px;font-weight:700;font-size:15px}
.dbar .tr{height:18px;background:var(--soft);position:relative}
.dbar .tr i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--s-unl);transform-origin:left;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.dbar .tr i.ok{background:var(--s-asg)}
.dbar .v{text-align:right;font-variant-numeric:tabular-nums}
@container app (max-width:760px){.dbar{grid-template-columns:96px minmax(0,1fr) 82px;font-size:14px}}
.grow-pre .dbar .tr i{transform:scaleX(0)}

/* ====== БОТ ====== */
.botpc{display:grid;grid-template-columns:minmax(0,1fr) 392px minmax(0,1fr);gap:24px;align-items:start;padding:24px;justify-content:center}
@container app (max-width:1099px){.botpc{grid-template-columns:392px;justify-content:center}.botpc .mir{display:none}}
.mir{display:flex;flex-direction:column;gap:12px}
.mir h3{font-size:18px;font-weight:500;color:var(--ink2)}
.mir .panel{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mir .st-w{font:600 30px var(--fd);text-transform:uppercase}
.pf{width:392px;height:760px;border:1px solid var(--edge);border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px var(--soft);background:var(--panel);display:flex;flex-direction:column}
.chat{display:flex;flex-direction:column;min-height:100vh;background:var(--panel);width:100%}
.pf .chat{min-height:0;height:100%}
.ch-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brand);color:var(--brandInk)}
.ch-h .av{width:40px;height:40px;background:var(--act);color:var(--actInk);display:grid;place-items:center;border-radius:50%;border:1px solid var(--actInk)}
.ch-h b{display:block;font:500 18px var(--fd);line-height:1.1}
.ch-h small{opacity:.85;font-size:13px}
.ch-w{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.ch-w select{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);background:var(--panel);padding:0 8px;border-radius:3px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pf .msgs{overflow-y:auto}
.msg{max-width:86%;padding:8px 12px 6px;border-radius:12px;font-size:16px;line-height:1.35;position:relative}
.msg time{display:block;text-align:right;font-size:12px;opacity:.7;margin-top:2px}
.msg.in{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:3px}
.msg.out{background:var(--act);color:var(--actInk);align-self:flex-end;border-top-right-radius:3px;font-weight:700}
.msg.sys{align-self:center;background:var(--soft);font-size:14px;padding:3px 12px;border-radius:12px;max-width:94%;text-align:center}
.msg.nw{animation:msgin .28s ease-out}
.msg b{font-weight:700}
.kb{padding:10px 12px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.kb .r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kb .btn{min-height:52px;padding:0 6px;font-size:16px;flex-direction:column;gap:2px;line-height:1.1}
.kb .btn .ic{width:20px;height:20px}
.kb .btn.next{background:var(--act);color:var(--actInk);border-color:var(--actInk)}
.kb .btn.cur{background:var(--sel);color:var(--selInk)}.kb .btn.cur[disabled]{opacity:1}
.kb .fake{min-height:44px;border:1px solid var(--line);border-radius:22px;padding:0 14px;display:flex;align-items:center;color:var(--ink2);font-size:15px;background:var(--bg)}

/* ====== СЛОИ ====== */
#ov{position:fixed;inset:0;z-index:50;pointer-events:none}
#stage.phone #ov{position:absolute}
#ov:not(:empty){pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(10,18,22,.55);animation:fadein .2s}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--edge);border-radius:3px;animation:pop .22s ease-out;display:flex;flex-direction:column}
@media (max-width:620px){.sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:92%;animation:slide .26s ease-out;border-left:0;border-right:0;border-bottom:0}}
#stage.phone .sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:92%;animation:slide .26s ease-out;border-left:0;border-right:0;border-bottom:0}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.sh-h h2{font-size:26px;font-weight:600}
.sh-h .ibtn{margin-left:auto}
.sh-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.sh-f{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel)}
.sh-f .btn{flex:1}
.stp{display:flex;gap:6px;font-weight:700;font-size:14px;color:var(--ink2)}
.stp span{flex:1;border-top:3px solid var(--line);padding-top:4px}
.stp span.on{border-color:var(--act);color:var(--ink)}
.okbig{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.okbig .no{font:700 60px var(--fd);line-height:1}
.hs{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hs li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px}
.hs li::before{content:counter(s);width:34px;height:34px;background:var(--act);color:var(--actInk);display:grid;place-items:center;font:600 20px var(--fd);border:1px solid var(--actInk)}
.hs b{display:block}
.hs .btn{margin-top:6px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
body.m-client #toasts{bottom:20px}
@media (max-width:520px){body.m-client #toasts{bottom:78px}}
#stage.phone ~ #toasts{display:none}
#stage.phone #toasts{position:absolute;bottom:76px}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:3px;font-weight:700;animation:pop .22s ease-out;width:100%;border-left:4px solid var(--act)}

/* пульт П3: вертикальная капсула у правого края */
.pult{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:2px;padding:6px;width:76px;border:1px solid var(--edge);border-radius:14px;background:var(--panel)}
.pult button{min-height:48px;border-radius:9px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.05;text-align:center;padding:2px}
.pult button .ic{width:20px;height:20px}
.pult button:hover{background:var(--soft)}
.pult button[aria-pressed="true"]{background:var(--sel);color:var(--selInk)}
.pult .sep{height:1px;background:var(--line);margin:3px 6px}
.gear{display:none}
@media (max-width:520px){
  .pult{display:none;top:auto;bottom:80px;right:12px;transform:none;width:196px;border-radius:6px}
  .pult button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:16px;padding:0 10px}
  .pult .dev{display:none}
  body.pult-open .pult{display:flex;animation:pop .2s}
  .gear{display:grid;position:fixed;right:12px;bottom:80px;width:44px;height:44px;place-items:center;z-index:61;background:var(--panel);border:1px solid var(--edge);border-radius:50%}
  body.pult-open .gear{bottom:auto;top:12px}
  body.has-sheet .gear,body.has-sheet .pult{display:none}
  body.m-driver .gear,body.m-admin .gear{bottom:16px}
  body.m-driver .pult,body.m-admin .pult{bottom:68px}
}
body.clean .pult,body.clean .gear{display:none!important}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1}}
.toast{animation-name:fadein}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flash{0%,60%{background:var(--hl)}100%{background:transparent}}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ent .hero{animation:rise .7s ease-out both}
.ent .cols>*{animation:rise .7s .12s ease-out both}
.ent .kpis{animation:rise .6s ease-out both}
.pn-in{animation:fadein .18s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const hs=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h};
const EDGES=[['klu','zar'],['klu','dub'],['klu','ver'],['klu','olh'],['ver','zar'],['zar','gri'],['zar','olh'],['gri','sok'],['olh','sok'],['olh','dub'],['olh','mal'],['sok','mal']];
const RC={};
function edge(a,b){
  const rev=a>b,p=rev?b:a,q=rev?a:b,k=p+'-'+q;
  if(!RC[k]){
    const A=TOWNS[p],B=TOWNS[q],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,h=hs(k);
    const o=[((h%7)-3)*.02,(((h>>3)%7)-3)*.026,(((h>>5)%7)-3)*.018],pts=[[A.x,A.y]];
    [.3,.62,.84].forEach((t,i)=>pts.push([A.x+dx*t+nx*L*o[i],A.y+dy*t+ny*L*o[i]]));
    pts.push([B.x,B.y]);RC[k]=pts;
  }
  return rev?RC[k].slice().reverse():RC[k];
}
function RT(a,b){
  const k='r'+a+b;if(RC[k])return RC[k];
  const prev={},q=[a];prev[a]=null;
  while(q.length){const x=q.shift();if(x===b)break;EDGES.forEach(e=>{const y=e[0]===x?e[1]:e[1]===x?e[0]:null;if(y&&!(y in prev)){prev[y]=x;q.push(y)}})}
  const path=[];for(let x=b;x;x=prev[x])path.unshift(x);
  let pts=[];for(let i=1;i<path.length;i++){const e=edge(path[i-1],path[i]);pts=pts.concat(i>1?e.slice(1):e)}
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return RC[k]={pts,cum,len:cum[cum.length-1]};
}
const kmOf=(a,b)=>Math.round(RT(a,b).len*.34);
function posAt(r,f){
  const d=Math.max(0,Math.min(1,f))*r.len;let i=1;
  while(i<r.cum.length-1&&r.cum[i]<d)i++;
  const s=(d-r.cum[i-1])/((r.cum[i]-r.cum[i-1])||1),A=r.pts[i-1],B=r.pts[i];
  return {x:A[0]+(B[0]-A[0])*s,y:A[1]+(B[1]-A[1])*s,i};
}
function partial(r,f){
  const p=posAt(r,f),out=r.pts.slice(0,p.i).map(a=>a.slice());out.push([p.x,p.y]);return out;
}
const dstr=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');

  return t;
}

function logAdd(t,s,by){t.log.push({t:nowMin(),s,by})}
function setStatus(id,s,by){
  const t=trip(id);if(!t||t.st===s)return false;

  t.st=s;logAdd(t,s,by);

  if(s==='enroute')t.prog=Math.max(t.prog,.02);

function mapHtml(list,focus,opt){
  opt=opt||{};
  const roads=new Set(EDGES.map(e=>e.join('-')));
  let svg='<svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">';
  for(let x=100;x<1000;x+=100)svg+=`<line x1="${x}" y1="0" x2="${x}" y2="600" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".55"/>`;
  for(let y=100;y<600;y+=100)svg+=`<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".55"/>`;
  svg+=`<path d="M0 470 C 120 430 200 470 300 440 S 480 330 560 300 S 760 330 1000 250" fill="none" stroke="var(--water)" stroke-width="16" vector-effect="non-scaling-stroke" opacity=".9"/>`;
  [...roads].forEach(k=>{const [a,b]=k.split('-'),d=dstr(edge(a,b));
    svg+=`<path d="${d}" fill="none" stroke="var(--roadEdge)" stroke-width="7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="${d}" fill="none" stroke="var(--road)" stroke-width="4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`});
  list.forEach(t=>{
    const r=RT(t.a,t.b),isF=t.id===focus||list.length===1;
    svg+=`<path d="${dstr(r.pts)}" fill="none" stroke="var(--brand)" stroke-width="${isF?4:3}" stroke-dasharray="${isF?'9 8':'3 7'}" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="${isF?.85:.55}"/>`;
    svg+=`<path class="pass" data-t="${t.id}" d="${dstr(partial(r,t.prog))}" fill="none" stroke="var(--brand)" stroke-width="${isF?6:4}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
  svg+='</svg>';
  let h='';
  TN.forEach(k=>{if(list.length===1&&(k===list[0].a||k===list[0].b)){const T=TOWNS[k];h+=`<i class="tn${k==='klu'?' hub':''}" style="left:${T.x/10}%;top:${T.y/6}%"></i>`;return}const T=TOWNS[k],dx=T.l==='l'?-1:T.l==='r'?1:0,dy=T.l==='t'?-1:T.l==='b'?1:0;
    h+=`<i class="tn${k==='klu'?' hub':''}" style="left:${T.x/10}%;top:${T.y/6}%"></i><span class="tl-lbl" style="left:calc(${T.x/10}% + ${dx*44}px);top:calc(${T.y/6}% + ${dy*17}px)">${T.n}${k==='klu'?' (склад)':''}</span>`});
  list.forEach(t=>{
    const r=RT(t.a,t.b),A=TOWNS[t.a],B=TOWNS[t.b];
    if(list.length===1){
      h+=`<span class="pin" style="left:${A.x/10}%;top:calc(${A.y/6}% - 10px)">Откуда: ${A.n}</span><span class="pin b" style="left:${B.x/10}%;top:calc(${B.y/6}% - 10px)">Куда: ${B.n}</span>`;
    }
    if(t.truck&&t.st!=='new'){
      const p=posAt(r,t.prog);
      h+=`<div class="mk${list.length>1?' sm':''}${t.id===S.sel&&list.length>1?' sel':''}" data-t="${t.id}" style="left:${p.x/10}%;top:${p.y/6}%" title="Рейс ${t.id}">${ic('truck')}</div>`;
      if(list.length>1)h+=`<span class="mklbl" data-lt="${t.id}" style="left:${p.x/10}%;top:${p.y/6}%">№${t.id}</span>`;
    }
  });
  return `<div class="mapbox" role="img" aria-label="Схема маршрута">${svg}${h}</div>`;
}

      const nw=S.botNew===t.id+':'+i?' nw':'';
      if(l.s==='new')return;
      if(l.s==='assigned')msgs+=`<div class="msg in${nw}"><b>Новый рейс №${t.id}</b><br>${TOWNS[t.a].n} → ${TOWNS[t.b].n}, ${kmT(t)} км<br>Груз: ${esc(t.cargo)}, ${String(t.wt).replace('.',',')} т<br>Клиент: ${esc(t.client)}<time>${tm(l.t)}</time></div>`;
      else if(l.by==='bot')msgs+=`<div class="msg out${nw}">${BTN[l.s]}<time>${tm(l.t)}</time></div><div class="msg in${nw}">Принято: <b>${ST[l.s].n}</b>. Клиент и диспетчер уже видят статус.${l.s==='done'?'<br>Счёт по рейсу выставлен.':''}<time>${tm(l.t)}</time></div>`;
      else if(l.by==='auto')msgs+=`<div class="msg in${nw}">Вы на месте в ${TOWNS[t.b].n}. Когда закончите разгрузку, нажмите «Разгрузился».<time>${tm(l.t)}</time></div>`;
      else msgs+=`<div class="msg sys${nw}">Диспетчер сменил статус: ${ST[l.s].n} · ${tm(l.t)}</div>`;
    });
  }
  const ci=t?ORDER.indexOf(t.st):0;
  const kb=['loading','enroute','done'].map(s=>{
    const si=ORDER.indexOf(s);let dis=!t||t.st==='done'||!t.truck;
    if(t&&!dis){if(si<=ci)dis=true;if(s==='done'&&ci<3)dis=true}
    const nextS=t?(t.st==='assigned'?'loading':t.st==='loading'?'enroute':(t.st==='enroute'||t.st==='unloading')?'done':''):'';
    const cur=t&&t.st===s;
    return `<button class="btn${nextS===s?' next':''}${cur?' cur':''}" data-a="bot-btn" data-v="${s}"${dis&&!cur?' disabled':''}${cur?' aria-pressed="true" disabled':''}>${ic(BICON[s])}${BTN[s]}</button>`;
  }).join('');
  return `<div class="chat"><div class="ch-h"><span class="av">${ic('truck')}</span><div><b>Трасса · бот водителя</b><small>${esc(d.n)} · Telegram</small></div></div>${sel}<div class="msgs" id="msgs" tabindex="0" aria-label="Переписка с ботом">${msgs}</div><div class="kb"><div class="r3">${kb}</div><div class="fake">${ic('message-circle')}&nbsp;Печатать не нужно, только кнопки</div></div></div>`;
}

/* ---------- рендер ---------- */
const ROUTES=['#/','#/trips','#/invoices','#/a','#/a/debts','#/a/park','#/driver'];
function wideNow(){return $('#frame').clientWidth>=1000}
function render(){
  const fr=$('#frame'),view=$('#view'),r=S.route;
  const keep={st:fr.scrollTop,bd:(view.querySelector('.board')||{}).scrollLeft||0,dr:(view.querySelector('.drawer')||{}).scrollTop||0,sh:(document.querySelector('.sheet')||{}).scrollTop||0};
  const ae=document.activeElement,fk=ae&&ae!==document.body&&ae.closest&&(ae.closest('#view')||ae.closest('.sheet'))?{id:ae.id,a:ae.dataset&&ae.dataset.a,v:ae.dataset&&ae.dataset.v,c:ae.dataset&&ae.dataset.c,cls:ae.className}:null;
  S.wide=wideNow();
  document.body.className=(r.startsWith('#/a')?'m-admin':r==='#/driver'?'m-driver':'m-client')+(S.sheet?' has-sheet':'')+(S.pultOpen?' pult-open':'')+(CLEAN?' clean':'')+(S.device==='phone'?' phonemode':'')+(S.entered?'':' ent');
  $('#stage').classList.toggle('phone',S.device==='phone'&&matchMedia('(min-width:521px)').matches);
  if(S.sheet&&S.sheet.k==='trip'&&S.wide){S.sheet=null}

  if(r.startsWith('#/a')){html=r==='#/a/debts'?adminDebts():r==='#/a/park'?adminPark():adminBoard()}
  else if(r==='#/driver')html=driverView();else html=clientView();
  view.innerHTML=html;
  $('#ov').innerHTML=sheetHtml();
  $('#pult').innerHTML=pultHtml();
  fr.scrollTop=keep.st;const b=view.querySelector('.board');if(b)b.scrollLeft=keep.bd;const dr=view.querySelector('.drawer');if(dr)dr.scrollTop=keep.dr;
  const sh=document.querySelector('.sheet');if(sh){sh.scrollTop=keep.sh}
  const ms=$('#msgs');if(ms)ms.scrollTop=ms.scrollHeight;
  if(fk){let el=null;if(fk.id)el=document.getElementById(fk.id);if(!el&&fk.a)el=$$('[data-a="'+fk.a+'"]').find(x=>x.dataset.v===fk.v);if(!el&&fk.c)el=$('[data-c="'+fk.c+'"]');if(el&&el.focus&&!el.disabled)el.focus({preventScroll:true})}
  else if(sh&&!S.sheetFocused){S.sheetFocused=true;sh.focus({preventScroll:true})}
  if(!S.sheet)S.sheetFocused=false;
  if(!S.kpiDone&&r==='#/a'&&!STILL&&!RM){S.kpiDone=true;$$('[data-count]').forEach(el=>{const v=+el.dataset.count,m=el.dataset.money==='1',t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/700),e=1-Math.pow(1-k,3),x=Math.round(v*e);el.textContent=m?fmt(x):fmtn(x);if(k<1)requestAnimationFrame(f)})(t0)})}
  else if(r==='#/a')S.kpiDone=true;
  const db=$('#dbars');if(db&&!S.barsDone){if(RM||STILL){S.barsDone=true;db.classList.remove('grow-pre')}else{S.barsDone=true;requestAnimationFrame(()=>requestAnimationFrame(()=>db.classList.remove('grow-pre')))}}
  if(S.botNew)setTimeout(()=>{S.botNew=null},80);
  if(!S.entered){S.entered=true;setTimeout(()=>document.body.classList.remove('ent'),900)}
}
function softRender(){
  const a=document.activeElement;
  if(S.sheet&&S.sheet.k==='order')return;
  if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
  render();
}
function setRoute(h){
  if(!ROUTES.includes(h))h='#/';
  S.route=h;S.sheet=null;S.pultOpen=false;
  try{history.replaceState(null,'',h)}catch(e){}
  render();
  const fr=$('#frame');fr.scrollTop=0;window.scrollTo(0,0);
}

function openTrip(id){S.sel=id;S.openCard=true;if(!wideNow())S.sheet={k:'trip'}}
const ACT={
 go(v){setRoute(v)},
 theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark'},

 help(){S.sheet={k:'help'};S.pultOpen=false},
 close(){S.sheet=null},
 'close-card'(){S.sheet=null;S.sel=null;S.openCard=false},
 open(v){openTrip(+v)},
 'open-park'(v){S.route='#/a';openTrip(+v);try{history.replaceState(null,'','#/a')}catch(e){}},
 tf(v){S.tfilt=v},
 'open-trip'(v){S.focus=+v;S.route='#/'},
 dl(){toast('В демо файл счёта не формируется')},
 'order-open'(){S.co={step:1,from:'klu',to:'zar',cargo:'Паллеты',wt:'4',day:'Завтра',name:'',phone:'',note:'',errs:{},done:null};S.sheet={k:'order'}},
 'o-next'(){
  const c=S.co,e={};
  if(!c.from)e.from='Выберите, откуда везти';
  if(!c.to)e.to='Выберите, куда везти';
  if(c.from&&c.to&&c.from===c.to)e.to='Пункты отправления и назначения совпадают';
  const w=parseFloat(String(c.wt).replace(',','.'));
  if(!(w>=0.1&&w<=20))e.wt='Вес от 0,1 до 20 т';
  c.errs=e;if(!Object.keys(e).length)c.step=2},
 'o-back'(){S.co.step=1;S.co.errs={}},
 'o-submit'(){
  const c=S.co,e={};
  if(!/^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё\s\-]{1,39}$/.test(c.name.trim()))e.name='Введите имя буквами, от 2 до 40 символов';
  const dg=c.phone.replace(/\D/g,'');
  if(!(dg.length===10||dg.length===11)||/[^\d\s()+\-]/.test(c.phone))e.phone='Телефон: 10 или 11 цифр';
  c.errs=e;if(Object.keys(e).length)return;
  const w=parseFloat(String(c.wt).replace(',','.')),km=kmOf(c.from,c.to),id=S.nextId++;
  const t={id,client:S.cl,a:c.from,b:c.to,cargo:c.cargo,wt:w,st:'new',prog:0,truck:null,drv:null,price:Math.round(km*(55+w*5)/100)*100,note:(c.note||'').trim().slice(0,120),day:'today',late:0,inv:null,log:[{t:nowMin(),s:'new',by:'client'}]};
  S.trips.push(t);S.focus=id;S.flash=id;c.done=id;
  clearTimeout(S.ft);S.ft=setTimeout(()=>{S.flash=null;softRender()},2200)},
 'order-to-trip'(){S.sheet=null;S.route='#/';S.co=null},
 'set-st'(v){const t=trip(S.sel);if(!t)return;if(!setStatus(t.id,v,'dsp'))return;toast('Рейс №'+t.id+': '+ST[v].n+'. Клиент уже видит.')},
 'next-st'(){const t=trip(S.sel);if(!t)return;const n=ORDER[ORDER.indexOf(t.st)+1];if(n&&setStatus(t.id,n,'dsp'))toast('Рейс №'+t.id+': '+ST[n].n+'. Клиент уже видит.')},
 'do-asg'(){
  const t=trip(S.sel);if(!t)return;const a=S.asg[t.id]||{truck:t.truck||'',drv:t.drv||''};
  if(!a.truck||!a.drv){S.perr[t.id]=Object.assign(S.perr[t.id]||{},{asg:'Выберите машину и водителя'});return}
  if(busyTrk(a.truck,t.id)||busyDrv(a.drv,t.id)){S.perr[t.id]=Object.assign(S.perr[t.id]||{},{asg:'Эта машина или водитель уже в рейсе'});return}
  S.perr[t.id]=Object.assign(S.perr[t.id]||{},{asg:''});
  const was=t.st;assign(t.id,a.truck,a.drv);delete S.asg[t.id];

 'price-save'(){
  const t=trip(S.sel);if(!t)return;const el=$('#pr-in'),raw=el?el.value.replace(/\s/g,''):'';
  if(!/^\d{4,6}$/.test(raw)||+raw<1000||+raw>500000){S.perr[t.id]=Object.assign(S.perr[t.id]||{},{price:'Сумма от 1 000 до 500 000 ₽'});return}
  t.price=+raw;S.perr[t.id]=Object.assign(S.perr[t.id]||{},{price:''});toast('Стоимость рейса №'+t.id+': '+fmt(t.price)+'. Клиент видит новую сумму.')},
 'inv-paid'(v){const t=trip(+v);if(!t||!t.inv)return;t.inv.paid=true;toast('Счёт '+t.inv.no+' оплачен: '+fmt(t.price))},
 'remind-inv'(v){const t=trip(+v);if(!t)return;S.reminded[t.id]=true;toast('Напоминание по счёту '+t.inv.no+' отправлено клиенту (демо)')},
 'remind-cl'(v){S.reminded[v]=true;toast('Напоминание отправлено: '+v+' (демо)')},
 exp(v){S.exp[v]=!S.exp[v]},
 'copy-link'(v){toast('Ссылка trassa.demo/r/'+v+' скопирована (демо)')},
 'as-client'(v){const t=trip(+v);if(!t)return;S.cl=t.client;S.focus=t.id;setRoute('#/');return false},
 'to-bot'(v){const t=trip(+v);if(!t||!t.drv)return;S.drv=t.drv;setRoute('#/driver');return false},
 'bot-btn'(v){

 }
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a,f=ACT[a];if(!f)return;

});
document.addEventListener('change',ev=>{
  const el=ev.target,c=el.dataset&&el.dataset.c;if(!c)return;
  if(c==='drv'){S.drv=el.value;S.botNew=null;render();return}

    const t=trip(S.sel);if(!t)return;const a=S.asg[t.id]=S.asg[t.id]||{truck:t.truck||'',drv:t.drv||''};
    if(c==='asg-truck'){a.truck=el.value;if(el.value){const d=trk(el.value).drv;if(!busyDrv(d,t.id))a.drv=d}}else a.drv=el.value;
    S.perr[t.id]=Object.assign(S.perr[t.id]||{},{asg:''});render();return}
  if(S.co&&c.startsWith('o-')){
    const k=c.slice(2);S.co[k==='wt'||k==='name'||k==='phone'||k==='note'?k:k]=el.value;

document.addEventListener('input',ev=>{

document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(S.sheet){S.sheet=null;if(S.route.startsWith('#/a'))S.sel=null;render()}else if(S.sel&&S.route.startsWith('#/a')){S.sel=null;S.openCard=false;render()}}
  if(ev.key==='Tab'&&S.sheet){const sh=$('.sheet');if(!sh)return;const f=[...sh.querySelectorAll('button,select,input,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const a=f.indexOf(document.activeElement);if(ev.shiftKey&&(a<=0)){ev.preventDefault();f[f.length-1].focus()}else if(!ev.shiftKey&&a===f.length-1){ev.preventDefault();f[0].focus()}}
});
window.addEventListener('hashchange',()=>{const h=location.hash||'#/';if(h!==S.route)setRoute(h)});
if(window.ResizeObserver)new ResizeObserver(()=>{if(wideNow()!==S.wide)softRender()}).observe($('#frame'));

/* ---------- живое: машины едут ---------- */
function tick(){
  const dp=RM?.024:.006;let ch=false;
  S.trips.forEach(t=>{
    if(t.st!=='enroute')return;
    t.prog=Math.min(.985,t.prog+dp);
    if(t.prog>=.985){t.prog=1;setStatus(t.id,'unloading','auto');ch=true;toast('Рейс №'+t.id+' прибыл: разгрузка');return}
    const r=RT(t.a,t.b),p=posAt(r,t.prog),x=p.x/10+'%',y=p.y/6+'%';
    $$('.mk[data-t="'+t.id+'"]').forEach(m=>{m.style.left=x;m.style.top=y});
    $$('[data-lt="'+t.id+'"]').forEach(m=>{m.style.left=x;m.style.top=y});
    $$('path.pass[data-t="'+t.id+'"]').forEach(m=>m.setAttribute('d',dstr(partial(r,t.prog))));
    $$('.rl-truck[data-t="'+t.id+'"]').forEach(m=>m.style.left=t.prog*100+'%');
    $$('.rl-done[data-t="'+t.id+'"]').forEach(m=>m.style.width=t.prog*100+'%');
    $$('[data-pb="'+t.id+'"]').forEach(m=>m.style.width=t.prog*100+'%');
    $$('[data-kml="'+t.id+'"]').forEach(m=>m.textContent=kmLeft(t));
    $$('[data-eta="'+t.id+'"]').forEach(m=>m.textContent=etaT(t));
  });
  $$('[data-clock]').forEach(m=>m.textContent=tm(nowMin()));
  if(ch)softRender();
}
if(!STILL)setInterval(tick,RM?4000:1000);

/* старт */
(function(){
  const h=location.hash;S.route=ROUTES.includes(h)?h:'#/';
  render();
})();
</script>
</body>
