<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Зёрна: заказ кофе заранее (демо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>

/* Каркас: конфигуратор-разворот. Лес и цитрус. Толстые контуры, жёсткая тень. */
:root{
  --bg:#F3F5EE;--panel:#FFFFFF;--soft:#E7ECDF;--ink:#17261A;--ink2:#4B5C4F;--line:#D1D9C8;--edge:#17261A;
  --brand:#1F6B3A;--brandInk:#F3F5EE;--act:#F28C28;--actInk:#1A1208;--sel:#17261A;--selInk:#FFFFFF;
  --good:#1D7A43;--bad:#B93526;--warn:#9A5A00;--hl:#FFE2A8;--sh:3px 3px 0 var(--edge);
  --fd:'Geologica','Segoe UI',system-ui,sans-serif;--fb:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1610;--panel:#16231A;--soft:#1E2F23;--ink:#E9F1E4;--ink2:#A3B6A6;--line:#2B3E2F;--edge:#6F8F76;
  --brand:#2E8A52;--brandInk:#F3F8F0;--act:#F59A3B;--actInk:#1A1208;--sel:#E9F1E4;--selInk:#0D1610;
  --good:#5CC58A;--bad:#F37262;--warn:#E8A94A;--hl:#4B3B1A;--sh:3px 3px 0 #000;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1610;--panel:#16231A;--soft:#1E2F23;--ink:#E9F1E4;--ink2:#A3B6A6;--line:#2B3E2F;--edge:#6F8F76;
  --brand:#2E8A52;--brandInk:#F3F8F0;--act:#F59A3B;--actInk:#1A1208;--sel:#E9F1E4;--selInk:#0D1610;
  --good:#5CC58A;--bad:#F37262;--warn:#E8A94A;--hl:#4B3B1A;--sh:3px 3px 0 #000;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--fb);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:700;line-height:1.1;text-wrap:balance}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* stage: ПК или рамка телефона */
#stage{position:relative;min-height:100vh}
#frame{container:app/inline-size;background:var(--bg);min-height:100vh;padding-bottom:96px}
@media (min-width:521px){
  #stage.phone{width:390px;height:800px;margin:16px auto 0;border:3px solid var(--edge);border-radius:36px;overflow:hidden;transform:translateZ(0);box-shadow:8px 8px 0 var(--edge);min-height:0}
  #stage.phone #frame{height:100%;min-height:0;overflow-y:auto;padding-bottom:0;scrollbar-width:none}
  body.phonemode{background:var(--soft)}
}
@media (max-width:520px){#frame{padding-bottom:0}.pc-only{display:none!important}}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--edge);border-radius:14px;background:var(--panel);font-weight:700;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.cta{background:var(--act);color:var(--actInk);min-height:52px;padding:0 24px;font-family:var(--fd);font-size:17px}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--edge);border-radius:12px;background:var(--panel);position:relative}
.dot{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--act);color:var(--actInk);font:800 12px/20px var(--fb);text-align:center;border:2px solid var(--edge);padding:0 4px}

/* шапка */
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:2px solid var(--edge);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:800 22px var(--fd);letter-spacing:-.02em;margin-right:auto;min-height:44px;color:var(--ink)}
.logo svg{width:32px;height:32px}
.tabs{display:flex;gap:6px;margin:0 auto 0 8px}
.tab{min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:8px;position:relative}
.tab[aria-current="page"]{background:var(--sel);color:var(--selInk)}
.tab .dot{top:2px;right:0}
.ptbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--edge);border-radius:12px;background:var(--panel);font-weight:700;font-size:15px;max-width:100%}
.ptbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hdr-r{min-width:0}
.who{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--brand);color:var(--brandInk);font-weight:700;font-size:15px;border:2px solid var(--edge)}
.hdr-r{display:flex;align-items:center;gap:10px}
@container app (max-width:879px){.tabs{display:none}.ptbtn{padding:0 10px;font-size:14px;max-width:none;min-width:0}.hdr-r{flex:1;justify-content:flex-end}.logo{margin-right:0}.logo span.t{display:none}.who span{display:none}.who{padding:0 12px}}
@container app (max-width:420px){.logo{font-size:20px}}
.bnav{display:none}
@container app (max-width:879px){
  .bnav{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--edge);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;border-radius:12px;position:relative;color:var(--ink2)}
  .bnav button[aria-current="page"]{background:var(--sel);color:var(--selInk)}
  .bnav .dot{top:2px;right:calc(50% - 26px)}
}

/* гость: разворот */
.promo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:700}
.promo .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:2px solid var(--edge);border-radius:999px;background:var(--act);color:var(--actInk);font-size:14px}
.spread{display:grid;grid-template-columns:minmax(0,1fr);}
@container app (min-width:880px){.spread{grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:calc(100vh - 140px)}}
.stage{background:var(--sb,#F6C945);color:#17261A;border-bottom:2px solid var(--edge);padding:20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
@container app (min-width:880px){.stage{border-bottom:0;border-right:2px solid var(--edge);padding:32px 40px;position:sticky;top:70px;height:calc(100vh - 70px);align-self:start}}
.stage h1{font-size:clamp(34px,9cqw,44px);letter-spacing:-.03em}
@container app (min-width:880px){.stage h1{font-size:56px}}
.stage p{margin:0;max-width:34ch;font-weight:600}
.cupbox{display:grid;place-items:center;padding:4px 0;flex:1;min-height:0}
.cupbox .art{width:min(100%,200px);height:auto;max-height:200px}
@container app (min-width:880px){.cupbox .art{width:min(100%,380px);max-height:none}}
.cupbox.pop .art{animation:pop .32s ease-out}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{padding:5px 12px;border:2px solid #17261A;border-radius:999px;background:rgba(255,255,255,.7);font-weight:700;font-size:14px}
.stage .pr{position:absolute;top:18px;right:max(16px,env(safe-area-inset-right,0px));padding:6px 14px;border:2px solid #17261A;border-radius:12px;background:#fff;font:800 20px var(--fd);box-shadow:3px 3px 0 #17261A}
.stage .pr s{font:600 14px var(--fb);opacity:.6;margin-right:6px}
@container app (min-width:880px){.stage .pr{top:32px;right:40px;font-size:24px}}
.params{padding:20px max(16px,env(safe-area-inset-right,0px)) 0;display:flex;flex-direction:column;gap:22px;min-width:0}
@container app (min-width:880px){.params{padding:32px 40px 0;gap:26px}}
.sec h2{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{font:600 14px var(--fb);color:var(--ink2)}
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:116px;gap:10px;overflow-x:auto;padding:2px 4px 8px 2px;scroll-snap-type:x proximity}
@container app (min-width:880px){.tiles{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-columns:auto;overflow:visible}}
.tile{scroll-snap-align:start;border:2px solid var(--edge);border-radius:16px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .im{background:var(--tb);aspect-ratio:1/0.82;display:grid;place-items:center;border-bottom:2px solid var(--edge)}
.tile .im .art{width:86%;height:auto}
.tile b{display:block;padding:7px 9px 0;font-size:14px;line-height:1.2;font-family:var(--fd);font-weight:600}
.tile span{display:block;padding:2px 9px 8px;font-size:14px;font-weight:700;color:var(--ink2)}
.tile span s{opacity:.6;margin-right:4px}
.tile[aria-pressed="true"]{box-shadow:var(--sh);transform:translate(-2px,-2px);outline:3px solid var(--sel);outline-offset:1px}
.tile[aria-pressed="true"] b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--act);margin-left:6px;border:1.5px solid var(--edge)}
.tile[disabled]{opacity:.55;cursor:not-allowed}
.tile .out{position:absolute;top:6px;left:6px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px;border:2px solid var(--edge)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 16px;border:2px solid var(--edge);border-radius:12px;background:var(--panel);font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.opt small{font-weight:600;color:var(--ink2);font-size:13px}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{background:var(--sel);color:var(--selInk)}
.opt[aria-pressed="true"] small{color:inherit;opacity:.75}
.opt:hover{background:var(--soft)}
.opt[aria-pressed="true"]:hover{background:var(--sel)}
.place{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--panel);font-weight:600;flex-wrap:wrap}
.place b{font-family:var(--fd)}
.bar{position:sticky;bottom:0;z-index:4;margin:6px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px;background:var(--bg);border-top:2px solid var(--edge);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@container app (min-width:880px){.bar{bottom:84px;margin:0;padding:14px 18px;border:2px solid var(--edge);border-radius:18px;background:var(--panel);box-shadow:var(--sh)}}
@container app (max-width:879px){.bar{bottom:68px;flex-wrap:nowrap;gap:10px;padding-top:10px;padding-bottom:10px}.bar .hint{display:none}.bar .btn.cta{padding:0 16px;font-size:16px}.bar .btn.cta .ic{display:none}.sum b{font-size:22px}}
@media (max-width:520px){.bar{bottom:68px}}
.qty{display:flex;align-items:center;border:2px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--panel)}
.qty button{width:44px;height:44px;display:grid;place-items:center}
.qty button:hover{background:var(--soft)}
.qty b{min-width:30px;text-align:center;font-family:var(--fd)}
.sum{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.sum small{color:var(--ink2);font-size:13px;font-weight:600}
.sum b{font:800 24px var(--fd)}
.hint{font-size:14px;color:var(--ink2);font-weight:600;flex-basis:100%;margin:0}
.foot{padding:28px max(16px,env(safe-area-inset-left,0px)) 20px;color:var(--ink2);font-size:14px}

/* листы */
#layer{position:fixed;inset:0;z-index:50;pointer-events:none}
#layer .scrim{position:absolute;inset:0;background:rgba(10,20,12,.5);opacity:0;animation:fin .2s forwards;pointer-events:auto}
.sheet{position:absolute;pointer-events:auto;background:var(--panel);border:2px solid var(--edge);display:flex;flex-direction:column;max-height:92%;box-shadow:var(--sh);
  left:50%;top:50%;width:min(540px,calc(100% - 32px));transform:translate(-50%,-50%);border-radius:22px;animation:sin .28s ease-out}
@media (max-width:520px){.sheet{left:0;right:0;bottom:0;top:auto;width:auto;transform:none;border-radius:22px 22px 0 0;border-bottom:0;animation:sup .28s ease-out;max-height:88%}}
#stage.phone .sheet{left:0;right:0;bottom:0;top:auto;width:auto;transform:none;border-radius:22px 22px 0 0;border-bottom:0;animation:sup .28s ease-out;max-height:88%}
#layer.inphone{position:absolute;border-radius:33px;overflow:hidden}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 8px}
.sh-h h2{font-size:22px}
.sh-b{padding:8px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.sh-f{padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sh-f .btn{flex:1 1 140px;padding:0 12px}.sh-f .btn.cta{flex:2 1 170px}
.ticket{border:2px dashed var(--edge);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ticket .row{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.ticket .row.tot{font:800 20px var(--fd);border-top:2px solid var(--edge);padding-top:8px;margin-top:4px}
.ticket small{color:var(--ink2);font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:700;font-size:15px}
.fld input,.fld select,.fld textarea{min-height:48px;padding:0 14px;border:2px solid var(--edge);border-radius:12px;background:var(--panel);width:100%}
.fld textarea{padding:10px 14px;min-height:64px;resize:none}
.fld [aria-invalid="true"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.err{color:var(--bad);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.chk{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;min-height:48px;width:100%;text-align:left;font-weight:600}
.chk .bx{width:24px;height:24px;border:2px solid var(--edge);border-radius:7px;display:grid;place-items:center;flex:none;background:var(--panel)}
.chk[aria-pressed="true"]{border-color:var(--edge);background:var(--soft)}
.chk[aria-pressed="true"] .bx{background:var(--sel);color:var(--selInk)}
.chk .bx .ic{width:16px;height:16px;opacity:0}
.chk[aria-pressed="true"] .bx .ic{opacity:1}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.ok-big{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px 0}
.ok-big .no{font:800 44px var(--fd);letter-spacing:-.03em}
.ok-big .badge{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brandInk);display:grid;place-items:center;border:2px solid var(--edge);animation:pop .4s ease-out}
.qr{width:132px;height:132px;border:2px solid var(--edge);border-radius:10px;padding:8px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:2px solid var(--edge);border-radius:999px;font-weight:800;font-size:13px;background:var(--panel);white-space:nowrap}
.chip.s-new{background:var(--hl)}
.chip.s-making{background:var(--act);color:var(--actInk)}
.chip.s-ready{background:var(--brand);color:var(--brandInk)}
.chip.s-done{background:var(--soft);color:var(--ink2)}
.plist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.plist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;min-height:56px}
.plist button[aria-pressed="true"]{border-color:var(--edge);background:var(--soft)}
.plist small{color:var(--ink2);font-weight:600;display:block}

/* заказы и баллы */
.page{padding:20px max(16px,env(safe-area-inset-left,0px)) 16px;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page h1{font-size:30px}
.ocard{border:2px solid var(--edge);border-radius:18px;background:var(--panel);padding:16px;display:grid;gap:12px;box-shadow:var(--sh);position:relative}
.ocard .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ocard h3{font-size:19px}
.ocard .muted,.muted{color:var(--ink2);font-weight:600;font-size:14px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper div{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink2)}
.stepper div::before{content:"";height:8px;border-radius:4px;background:var(--line);border:2px solid var(--line)}
.stepper div.on{color:var(--ink)}
.stepper div.on::before{background:var(--brand);border-color:var(--edge)}
.stepper div.cur::before{background:var(--act)}
.page>*{flex-shrink:0}.olist .r{flex:none}.olist .r>span:first-child{flex:1 1 200px;min-width:0}.olist{display:flex;flex-direction:column;gap:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.olist .r{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.olist .r:last-child{border:0}
.lvl{border:2px solid var(--edge);border-radius:20px;background:var(--brand);color:var(--brandInk);padding:20px;display:grid;gap:12px;box-shadow:var(--sh)}
.lvl .big{font:800 54px var(--fd);letter-spacing:-.03em;line-height:1}
.lvl .bar2{height:12px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;border:2px solid var(--brandInk)}
.lvl .bar2 i{display:block;height:100%;background:var(--act);transform-origin:left;animation:grow .8s ease-out}
.stamps{display:flex;gap:8px;flex-wrap:wrap}
.stamp{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;background:var(--panel);color:var(--ink2)}
.stamp.on{background:var(--act);color:var(--actInk)}
.stamp.gift{border-style:dashed}
.grid2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* бариста */
.bhead h1{margin-bottom:6px}.bhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.board{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:900px){.board{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.bcol{border:2px solid var(--edge);border-radius:18px;background:var(--soft);padding:12px;display:flex;flex-direction:column;gap:12px;min-height:120px}
.bcol>h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.bcol>h2 .chip{background:var(--panel)}
@container app (max-width:899px){.bcol[data-on="0"]{display:none}}
.btabs{display:none}
@container app (max-width:899px){.btabs{display:flex;gap:8px;flex-wrap:wrap}}
.bcard{border:2px solid var(--edge);border-radius:14px;background:var(--panel);padding:14px;display:grid;gap:8px;position:relative;overflow:hidden}
.bcard h3{font-size:20px;display:flex;justify-content:space-between;gap:8px}
.bcard .big-no{font:800 22px var(--fd)}
.bcard .note{padding:6px 10px;border-radius:10px;background:var(--hl);font-weight:700;font-size:14px;overflow-wrap:anywhere}
.bcard .btn{width:100%;min-height:52px}
.fresh::after,.new-row::after{content:"";position:absolute;inset:0;background:var(--hl);opacity:0;pointer-events:none;animation:flash 2s ease-out;border-radius:inherit}
.empty{color:var(--ink2);font-weight:600;padding:18px 6px;text-align:center}

/* владелец */
.otabs{display:flex;gap:4px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--edge);background:var(--bg);position:sticky;top:70px;z-index:4;scrollbar-width:none}
.otabs::-webkit-scrollbar{display:none}
.otab{min-height:48px;padding:0 16px;font-weight:700;white-space:nowrap;display:flex;align-items:center;border-bottom:5px solid transparent;margin-bottom:-2px;color:var(--ink2)}
.otab[aria-current="page"]{border-bottom-color:var(--act);color:var(--ink)}
.otab:hover{color:var(--ink)}
.owrap{padding:20px max(16px,env(safe-area-inset-left,0px)) 16px;display:flex;flex-direction:column;gap:18px;max-width:1240px;margin:0 auto;animation:fin .25s}
.otools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.otools .clock{margin-left:auto;font-weight:700;color:var(--ink2);font-size:14px}
.kgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:700px){.kgrid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr)}}
.k{border:2px solid var(--edge);border-radius:18px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:4px;min-width:0}
.k.main{background:var(--brand);color:var(--brandInk);box-shadow:var(--sh)}
.k .l{font-weight:700;font-size:15px;opacity:.85}
.k .v{font:800 34px var(--fd);letter-spacing:-.02em;line-height:1.1}
.k.main .v{font-size:44px}
.k .d{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.k .d.up{color:var(--good)}.k .d.dn{color:var(--bad)}
.k.main .d{color:var(--brandInk)}
.goal{margin-top:8px;display:grid;gap:6px;font-size:14px;font-weight:700}
.goal .tr{height:12px;border-radius:6px;border:2px solid var(--brandInk);background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.goal .tr i{position:absolute;inset:0 auto 0 0;background:var(--act);transform-origin:left;animation:grow .8s ease-out}
.two{align-items:start;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:900px){.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.panel{border:2px solid var(--edge);border-radius:18px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{font:600 14px var(--fb);color:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);border-radius:4px;margin-right:6px;vertical-align:-2px}
.hours{display:flex;align-items:flex-end;gap:3px;height:190px;border-bottom:2px solid var(--edge);position:relative}
.hc{flex:1;min-width:0;height:100%;position:relative}
.hc .y{position:absolute;bottom:0;left:6%;right:6%;border:2px dashed var(--ink2);border-bottom:0;border-radius:5px 5px 0 0;opacity:.7}
.hc .t{position:absolute;bottom:0;left:16%;right:16%;display:flex;flex-direction:column;justify-content:flex-end;transform-origin:bottom;animation:rise .7s ease-out both;border:2px solid var(--edge);border-bottom:0;border-radius:5px 5px 0 0;overflow:hidden;background:var(--brand)}
.hc .t i{display:block;background:var(--act)}
.hx{display:flex;gap:3px;font-size:12px;font-weight:700;color:var(--ink2)}
.hx span{flex:1;text-align:center;min-width:0}
.now{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);pointer-events:none}
.now em{position:absolute;top:-2px;left:4px;font:700 12px var(--fb);color:var(--bad);font-style:normal;white-space:nowrap;background:var(--panel);padding:0 3px}
.attn{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.attn li{border:2px solid var(--edge);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.attn li b{display:flex;gap:8px;align-items:flex-start;line-height:1.3}
.attn li b .ic{color:var(--warn);margin-top:1px}
.hbar{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(80px,1.1fr) minmax(0,2.2fr) auto;gap:10px;align-items:center;font-weight:700;font-size:15px}
.hb .tr{height:16px;border:2px solid var(--edge);border-radius:8px;background:var(--bg);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--brand);transform-origin:left;animation:grow .7s ease-out both}
.hb.top1 .tr i{background:var(--act)}
.hb .val{text-align:right;white-space:nowrap}
.hb .val small{display:block;font-size:12px;font-weight:700}
.up{color:var(--good)}.dn{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:700;color:var(--ink2);padding:8px 10px;border-bottom:2px solid var(--edge);font-size:14px}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--soft)}
.tbl .r{text-align:right}.tbl td:first-child{white-space:nowrap}@container app (max-width:700px){.hn{display:none}}
.scroll-x{overflow-x:auto}
.feed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);position:relative;flex-wrap:wrap}
.feed li:last-child{border:0}
.feed .tm{color:var(--ink2);font-weight:700;font-size:14px}
.promo-row{display:grid;gap:10px;padding:14px;border:2px solid var(--edge);border-radius:16px;background:var(--panel)}
.promo-row .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.promo-row .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:56px;height:32px;border:2px solid var(--edge);border-radius:16px;background:var(--soft);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--edge);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(24px);background:#fff}
.swrow{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.stats3{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2);font-weight:700}
.stats3 b{color:var(--ink);font-family:var(--fd)}
.formgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:700px){.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid .full{grid-column:1/-1}}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) 120px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .im{width:56px;height:46px;border-radius:10px;border:2px solid var(--edge);background:var(--tb);display:grid;place-items:center;overflow:hidden}
.prow .im .art{width:90%}
.prow .err{grid-column:2/-1}
.prow input{min-height:44px;width:100%;padding:0 10px;border:2px solid var(--edge);border-radius:10px;background:var(--panel);text-align:right;font-weight:700}
.prow input[aria-invalid="true"]{border-color:var(--bad)}
@container app (max-width:560px){.prow{grid-template-columns:48px minmax(0,1fr) 92px}.prow .swrow{grid-column:2/-1}}
.phone-prev{border:2px solid var(--edge);border-radius:18px;padding:12px;background:var(--soft);display:grid;gap:6px;font-size:15px}
.phone-prev b{font-family:var(--fd)}
.phone-prev p{margin:0;overflow-wrap:anywhere}

/* пульт */
.pult{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;padding:6px;border:2px solid var(--edge);border-radius:999px;background:var(--panel);box-shadow:var(--sh);max-width:calc(100vw - 24px)}
.pult .m{display:flex;gap:2px;padding:2px;border-radius:999px;background:var(--soft)}
.pult button{min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pult .m button[aria-pressed="true"]{background:var(--sel);color:var(--selInk)}
.pult button:hover{background:var(--soft)}
.pult .m button[aria-pressed="true"]:hover{background:var(--sel)}
.pult .sep{width:2px;align-self:stretch;background:var(--line);margin:4px 2px}
.gear{display:none;position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:152px;z-index:60;width:48px;height:48px;border-radius:50%;border:2px solid var(--edge);background:var(--panel);box-shadow:var(--sh);place-items:center}
body.m-owner .gear,body.m-barista .gear{bottom:16px}
@media (max-width:520px){
  .gear{display:grid}
  .pult{display:none;left:auto;right:12px;bottom:204px;transform:none;flex-direction:column;align-items:stretch;border-radius:20px}
  body.m-owner .pult,body.m-barista .pult{bottom:72px}
  body.pult-open .pult{display:flex;animation:fin .2s}
  .pult .m{flex-direction:column;border-radius:16px}
  .pult .sep{display:none}
  body.has-sheet .gear,body.has-sheet .pult{display:none}
  .pult .dev{display:none}
}
body.clean .pult,body.clean .gear{display:none!important}
body.clean #frame{padding-bottom:0}
body.clean .bar{bottom:0!important}

.toasts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;border:2px solid var(--edge);box-shadow:var(--sh);animation:tin .25s ease-out;display:flex;gap:10px;align-items:center;pointer-events:auto;font-size:15px}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}
@media (max-width:520px){.toasts{top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto}}

/* анимации */
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.94) rotate(-1.5deg)}60%{transform:scale(1.03)}100%{transform:none}}
@keyframes sin{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
@keyframes drop{0%{opacity:0;transform:translateY(-34px) rotate(-4deg)}70%{opacity:1;transform:translateY(5px)}100%{opacity:1;transform:none}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.enter .cupbox .art{animation:drop .8s cubic-bezier(.2,.8,.3,1) both}
.enter .stage h1{animation:slide .6s ease-out both}
.steamg{animation:steam 1.4s ease-out both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function calc(c=S.cfg,co=S.co){
 const it=ITEM(c.item),sz=sizeOf(it,c.size);
 const md=it.milk?MILK.find(m=>m.k===c.milk).d:0, sd=!it.noOpt&&it.id!=='esp'||it.id==='esp'?SYR.find(s=>s.k===c.syrup).d:0;

 const unit=S.prices[it.id]+sz.d+md+(it.noOpt?0:sd)+ex;
 const full=unit*c.qty,pr=promoFor(it.id),disc=pr?Math.round(full*pr.val/100):0;
 let total=full-disc,gift=0,spend=0;
 const u=S.user;
 if(u&&co&&co.useGift&&u.gift){gift=Math.min(300,total)}
 if(u&&co&&co.usePts){spend=Math.min(u.points,Math.floor((total-gift)*.5))}
 const pay=total-gift-spend;
 const rate=u?lvlOf(u.spent).r:5;

 return {it,sz,unit,full,disc,pr,total,gift,spend,pay,earn,rate};
}

}

/* ====== владелец ====== */
function stats(pid){
 let checks=0,rev=0,pre=0,yc=0,yr=0,yp=0;
 POINTS.forEach(p=>{if(pid==='all'||p.id===pid){checks+=p.checks;rev+=p.rev;pre+=p.pre;const f=p.checks/123;yc+=Y.checks*f;yr+=Y.rev*f;yp+=Y.pre*f}});
 S.orders.forEach(o=>{if(!o.base&&o.day==='today'&&(pid==='all'||o.point===pid)){checks++;rev+=o.paid;pre++}});
 return {checks,rev,pre,avg:rev/checks,share:pre/checks*100,yc,yr,yavg:yr/yc,yshare:yp/yc*100};
}
const dlt=(a,b)=>b?Math.round((a-b)/b*100):0;
function dBadge(v,suf='%'){return `<span class="d ${v>=0?'up':'dn'}">${ic(v>=0?'trending-up':'trending-down')}${v>0?'+':v<0?'−':''}${Math.abs(v)}${suf} к вчера</span>`}
const cnt=(v,fmt)=>`<span class="num" data-count="${Math.round(v)}" data-fmt="${fmt||''}">${fmt==='rub'?rub(v):fmt==='pct'?Math.round(v)+'%':Math.round(v).toLocaleString('ru-RU')}</span>`;

function hoursChart(pid){
 const share=pid==='all'?1:PT(pid).checks/123;
 const cur=Array.from(TH,(v,i)=>Math.round(v*share));
 const added=S.orders.filter(o=>!o.base&&o.day==='today'&&(pid==='all'||o.point===pid)).length;
 const tod=HOURS.map((h,i)=>i<2?{n:Math.round(TH[i]*share)+(i===1?added:0),p:Math.round(TPRE[i]*share)+(i===1?added:0)}:null);
 const ys=YH.map(v=>Math.round(v*share));
 const max=Math.max(8,Math.ceil(Math.max(...ys,...tod.filter(Boolean).map(x=>x.n))*1.12));
 const cols=HOURS.map((h,i)=>{const t=tod[i];
  return `<div class="hc" title="${h}:00, вчера ${ys[i]}${t?', сегодня '+t.n:''}"><div class="y" style="height:${ys[i]/max*100}%"></div>${t?`<div class="t" style="height:${t.n/max*100}%;animation-delay:${i*60}ms"><i style="height:${t.n?t.p/t.n*100:0}%"></i></div>`:''}</div>`}).join('');
 const nowPct=((8*60+40)/60-7)/14*100;
 return `<div class="hours" role="img" aria-label="Чеки по часам, сегодня и вчера">${cols}<div class="now" style="left:${nowPct}%"><em>сейчас</em></div></div><div class="hx">${HOURS.map(h=>`<span class="num">${h}</span>`).join('')}</div>`;
}

}

function startCounts(){
 document.querySelectorAll('[data-count]').forEach(el=>{
  const to=+el.dataset.count,f=el.dataset.fmt,key=el.closest('.k')?.querySelector('.l')?.textContent||el.parentElement.id||'x';
  const fmt=v=>f==='rub'?rub(v):f==='pct'?Math.round(v)+'%':Math.round(v).toLocaleString('ru-RU');
  if(REDUCED||STILL||S.hit[key+f]){el.textContent=fmt(to);return}
  S.hit[key+f]=1;const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);else el.textContent=fmt(to)};requestAnimationFrame(step);
 });
}
function tick(){
 const nm=nowMin();
 document.querySelectorAll('[data-cd]').forEach(el=>{const d=Math.round(+el.dataset.cd-nm);el.textContent=d>0?`· через ${d} мин`:'· пора забирать'});
 document.querySelectorAll('[data-age]').forEach(el=>{el.textContent=Math.max(0,Math.round(nm-+el.dataset.age))+' мин'});
 const c=$('#clk');if(c)c.textContent=hhmm(nm);
}
setInterval(tick,1000);

function setStatus(no,st){

 o.status=st;S.fresh=no;
 if(o.mine){
  if(st==='making')note(`Заказ №${no} готовим`,'Бариста взял заказ в работу.');
  if(st==='ready')note(`Заказ №${no} готов`,`Заберите на точке «${PT(o.point).name}». Покажите QR на кассе.`);
  if(st==='done')note(`Заказ №${no} выдан`,'Приятного кофе. Баллы уже на счёте.');
 }

 if(STILL||S.autoN>=3||modeOf(S.route)!=='barista'||S.sheet)return;
 const ids=['cap','lat','ame','fil','fwh'],i=S.autoN++,it=ITEM(ids[(i*2+1)%ids.length]);
 const o={no:S.nextNo++,item:it.id,sz:it.sizes.length>2?'M':it.sizes[0].k,milk:'cow',syr:'none',extras:[],qty:1,point:POINTS[(i+1)%5].id,pick:Math.ceil(nowMin()/5)*5+10,created:nowMin(),status:'new',name:NAMES[(i+3)%NAMES.length],phone:'',note:'',total:S.prices[it.id],paid:S.prices[it.id],earn:0,mine:false,day:'today',base:false};
 addOrder(o);toast(`Новый предзаказ №${o.no}`);render();
}
setInterval(autoOrder,30000);

/* ====== валидация ====== */
const vName=s=>{s=s.trim();return /^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё\s.'-]{1,39}$/.test(s)?'':'Введите имя буквами, от 2 до 40 знаков'};
const vPhone=s=>{const d=s.replace(/\D/g,'');return d.length>=10&&d.length<=11&&(d.length===10||/^[78]/.test(d))?'':'Телефон: 10 или 11 цифр, например +7 900 000-00-00'};
const vPrice=s=>/^\d{2,4}$/.test(s.trim())&&+s>=50&&+s<=1000?'':'Цена от 50 до 1000 рублей, целым числом';

/* ====== действия ====== */
function demoLogin(){
 S.user={name:'Мария К.',phone:'+7 900 123-45-67',points:340,spent:1140,stamps:3,gift:false,visits:14};
 S.hist=[{t:'Вчера',d:'Заказ №2790, Лесная, 12',p:-60},{t:'Вчера',d:'Начислено за заказ №2790',p:12},{t:'3 дня назад',d:'Начислено за заказ №2744',p:14}];
 if(!S.orders.some(o=>o.mine))S.orders.push({no:2790,item:'cap',sz:'M',milk:'oat',syr:'none',extras:[],qty:1,point:'les',pick:0,created:0,status:'done',name:'Мария К.',phone:'',note:'',total:300,paid:240,earn:12,mine:true,day:'вчера',base:true},{no:2744,item:'lat',sz:'L',milk:'cow',syr:'van',extras:[],qty:1,point:'les',pick:0,created:0,status:'done',name:'Мария К.',phone:'',note:'',total:350,paid:350,earn:14,mine:true,day:'вчера',base:true});
}
function fixCfg(){
 const c=S.cfg,it=ITEM(c.item);
 if(!it.sizes.some(s=>s.k===c.size))c.size=it.sizes.length>1?(it.sizes.find(s=>s.k==='M')||it.sizes[0]).k:it.sizes[0].k;
 if(it.noOpt){c.syrup='none';c.extras=[]}
}
function submitOrder(){
 const co=S.co,k=calc(),c=S.cfg,u=S.user,slots=slotList();
 const o={no:S.nextNo++,item:c.item,sz:c.size,milk:c.milk,syr:c.syrup,extras:[...c.extras],qty:c.qty,point:c.point,pick:slots[c.slot],created:nowMin(),status:'new',name:co.name.trim(),phone:co.phone.trim(),note:co.note.trim(),total:k.total,paid:k.pay,earn:k.earn,mine:true,day:'today',base:false};
 addOrder(o);
 note(`Заказ №${o.no} принят`,`${lineText(o)}. ${PT(o.point).name}, к ${hhmm(o.pick)}.`);
 if(u){
  u.points+=k.earn-k.spend;u.spent+=k.pay;u.visits++;
  if(k.spend)S.hist.unshift({t:'Сегодня',d:`Списано за заказ №${o.no}`,p:-k.spend});
  if(k.earn)S.hist.unshift({t:'Сегодня',d:`Начислено за заказ №${o.no}`,p:k.earn});
  if(k.gift)u.gift=false;
  if(ITEM(c.item).kind==='coffee'){u.stamps+=c.qty;if(u.stamps>=6){u.stamps-=6;u.gift=true;note('Подарок за шесть чашек','Следующая чашка бесплатно, до 300 ₽. Включите подарок при оформлении.')}}
 }
 S.co={step:'ok',no:o.no,earn:u?k.earn:0};
}
document.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;
 const a=el.dataset.a,v=el.dataset.v,c=S.cfg;
 switch(a){
  case 'go':S.sheet=null;S.co=null;if(S.pultOpen){S.pultOpen=false;document.body.classList.remove('pult-open')}
   if(a==='go'&&(v==='#/barista'||v==='#/owner')&&modeOf(S.route)!==modeOf(v)){const un=S.notes.filter(n=>n.unread).length;void un}
   setRoute(v);if(modeOf(v)==='guest'&&!S.sheet){const rd=S.notes.find(n=>n.unread&&/готов$/.test(n.title)&&!n.shown);if(rd){rd.shown=true;toast(rd.title)}}return;
  case 'pult-toggle':S.pultOpen=!S.pultOpen;document.body.classList.toggle('pult-open',S.pultOpen);return;
  case 'device':S.device=S.device==='pc'?'phone':'pc';render();return;
  case 'theme':{const d=document.documentElement,dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);d.dataset.theme=dark?'light':'dark';render();return}
  case 'sheet':S.sheet=v;S.loginErr='';if(v==='notes'){S.notes.forEach(n=>n.unread=false);}renderLayer();document.body.classList.add('has-sheet');if(v==='notes')render();return;
  case 'close':S.sheet=null;S.co=null;S.loginErr='';render();return;
  case 'pick-item':c.item=v;fixCfg();S.pop=true;render();return;
  case 'pick-size':c.size=v;S.pop=true;render();return;
  case 'pick-milk':c.milk=v;S.pop=true;render();return;
  case 'pick-syr':c.syrup=v;S.pop=true;render();return;
  case 'pick-extra':c.extras=c.extras.includes(v)?c.extras.filter(x=>x!==v):[...c.extras,v];S.pop=true;render();return;
  case 'pick-slot':c.slot=+v;render();return;
  case 'qty':c.qty=Math.max(1,Math.min(4,c.qty+ +v));render();return;
  case 'pick-point':c.point=v;S.sheet=null;toast('Точка: '+PT(v).name);render();return;
  case 'open-co':S.co={step:1,usePts:false,useGift:false,note:'',name:S.user?S.user.name:'',phone:S.user?S.user.phone:'',pay:'app',err:{}};S.sheet='co';S.sheetFocused=false;render();return;
  case 'co-pts':S.co.usePts=!S.co.usePts;render();return;
  case 'co-gift':S.co.useGift=!S.co.useGift;if(S.co.useGift)S.co.usePts=S.co.usePts;render();return;
  case 'co-pay':S.co.pay=v;render();return;
  case 'co-next':S.co.step=2;S.sheetFocused=false;render();return;
  case 'co-back':S.co.step=1;S.sheetFocused=false;render();return;
  case 'demo-login-co':demoLogin();S.co.name=S.user.name;S.co.phone=S.user.phone;S.co.err={};toast('Вы вошли как демо-пользователь');render();return;
  case 'co-submit':{const co=S.co;co.err={};const n=vName(co.name),p=vPhone(co.phone);if(n)co.err.name=n;if(p)co.err.phone=p;
   if(n||p){render();const f=document.getElementById(n?'f-name':'f-phone');if(f)f.focus();return}
   submitOrder();render();return}
  case 'to-orders':S.sheet=null;S.co=null;setRoute('#/orders');return;
  case 'demo-login':demoLogin();S.sheet=null;toast('Вы вошли как демо-пользователь');render();return;
  case 'login-phone':{const p=document.getElementById('l-phone');S.lphone=p?p.value:'';const e=vPhone(S.lphone);S.loginErr=e||'В демо вход по номеру отключён. Нажмите «Войти как демо-пользователь».';render();return}
  case 'btab':S.bTab=v;render();return;
  case 'status':{const [no,st]=v.split('|');setStatus(+no,st);S.bTab=st==='done'?S.bTab:st;render();return}
  case 'opoint':S.oPoint=v;render();return;
  case 'ometric':S.oMetric=v;S.hit={};render();return;
  case 'glvl':S.gLvl=v;render();return;
  case 'goto-barista':setRoute('#/barista');return;
  case 'attn-done':S.attnDone[v]=true;toast('Отмечено');render();return;
  case 'attn-promo':S.attnDone.shk=true;S.promoOpen=true;S.pform={title:'Предзаказ на Школьной −15%',kind:'pct',item:'all',val:'15'};S.perr={};setRoute('#/owner/promos');return;
  case 'promo-open':S.promoOpen=true;S.perr={};render();return;
  case 'promo-close':S.promoOpen=false;render();return;
  case 'promo-toggle':{const p=S.promos.find(x=>x.id===+v);p.on=!p.on;toast(p.on?'Акция включена':'Акция выключена');render();return}
  case 'promo-send':{const p=S.promos.find(x=>x.id===+v);p.sent=true;note('Акция: '+p.title,'Закажите в приложении и заберите без очереди.');toast('Рассылка отправлена, охват '+p.reach.toLocaleString('ru-RU'));render();return}
  case 'stock':{S.stock[v]=!S.stock[v];toast(S.stock[v]?'Вернули в продажу':'Добавили в стоп-лист');render();return}
  case 'save-prices':{S.perrs={};let ok=true;
   ITEMS.forEach(i=>{const inp=document.getElementById('pr-'+i.id);const val=inp?inp.value:String(S.prices[i.id]);S.pdraft[i.id]=val;const e=vPrice(val);if(e){S.perrs[i.id]=e;ok=false}});
   if(ok){ITEMS.forEach(i=>{S.prices[i.id]=+S.pdraft[i.id]});S.pdraft={};toast('Цены сохранены, гости уже видят новые')}
   render();return}
 }
});
document.addEventListener('submit',ev=>{
 if(ev.target.id==='pform'){ev.preventDefault();
  const f=S.pform,e={};
  const t=f.title.trim();if(t.length<3||t.length>40)e.title='Название от 3 до 40 знаков';
  const n=+f.val,lim=f.kind==='pct'?[5,50]:[2,3];if(!/^\d{1,2}$/.test(String(f.val).trim())||n<lim[0]||n>lim[1])e.val=`Значение от ${lim[0]} до ${lim[1]}, целым числом`;
  S.perr=e;
  if(Object.keys(e).length){render();const id=e.title?'p-title':'p-val';const x=document.getElementById(id);if(x)x.focus();return}
  const id=Math.max(...S.promos.map(p=>p.id))+1;
  S.promos.unshift({id,title:t,kind:f.kind,item:f.kind==='x'?'all':f.item,val:n,on:true,sent:false,reach:1240,used:0,lift:'нет данных'});
  S.fresh='p'+id;S.promoOpen=false;S.pform={title:'',kind:'pct',item:'all',val:'15'};toast('Акция опубликована');render();
 }
});
document.addEventListener('input',ev=>{
 const t=ev.target,id=t.id;
 if(id==='f-name')S.co.name=t.value;else if(id==='f-phone')S.co.phone=t.value;else if(id==='f-note')S.co.note=t.value;
 else if(id==='p-title')S.pform.title=t.value;else if(id==='p-val')S.pform.val=t.value;
 else if(id==='l-phone')S.lphone=t.value;
 else if(id==='g-q'){S.gQ=t.value;render()}
 else if(id.startsWith('pr-'))S.pdraft[id.slice(3)]=t.value;
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.id==='p-kind'){S.pform.kind=t.value;S.pform.val=t.value==='pct'?'15':'2';S.perr={};render()}
 else if(t.id==='p-item'){S.pform.item=t.value}
 else if(t.id==='bp'){S.bPoint=t.value;render()}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&S.sheet){S.sheet=null;S.co=null;render()}
 if(ev.key==='Enter'&&S.sheet==='co'&&ev.target.tagName==='INPUT'){ev.preventDefault();$('[data-a="co-submit"]')?.click()}
});

/* ====== старт ====== */
if(CLEAN)document.body.classList.add('clean');
setRoute(ROUTES.includes(location.hash)?location.hash:'#/',true);
</script>
</body>
